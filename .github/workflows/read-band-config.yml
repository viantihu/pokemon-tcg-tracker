name: Read band config (Testing)

# DIAGNOSTIC for UIL-012 — dumps and VERDICTS the two config tables that decide a card's
# colour band, `color_band` and `type_color_map`, on the Testing project.
#
# WHY THIS NEEDS CI AT ALL. Both tables are RLS'd `for all to authenticated` with no grant to
# `anon` (0002_domain.sql:382-386), so the publishable key cannot read them — it needs a real
# authenticated session, which no agent has. The credential that can is
# secrets.SUPABASE_SERVICE_ROLE_KEY on the `testing` environment, which lives only in GitHub and
# is never printed. So this is the only programmatic path to the answer.
#
# WHAT IT IS LOOKING FOR. Committing a haul fails with
#   copy_color_band_fkey [23503]: Key is not present in table "color_band".
# `copy.color_band` is FK'd to `color_band(band)`, and every value in the runtime map is itself
# FK'd there (`type_color_map.band references color_band (band)`), so a mapped card can never
# produce this. The one value that can is the unmapped fallback in lib/engine/bands.ts:
#   export const WHITE: Band = "White";   // a DISPLAY name
# while lib/plan/context.ts:144 builds the map from the DB in KEY form (`red`, `dark_blue`,
# `white`). So a MISSING `type_color_map` row makes `band()` return the literal "White", which is
# absent from `color_band`, and the insert dies. A mis-CASED row cannot be the cause: the FK means
# `type_color_map.band = 'White'` requires `color_band.band = 'White'` to exist, and then the copy
# insert would satisfy the FK and there would be no error.
#
# So the question this answers is narrow: are all ten bands and all fourteen mappings present, in
# key form? A missing mapping names the card class that crashes.
#
# TRIGGER. Prefer `gh workflow run read-band-config.yml --ref ops/read-band-config` — the
# `workflow_dispatch` **API** works even though the file is not on the default branch (only the UI
# *button* needs that, and `main` lags `develop` until the cutover). Dispatch also costs no Vercel
# build, whereas a push to this branch does. Push still works as a trigger.
#
# PARAMETERISED (2026-09-18): the final "Schema probe" step takes two dispatch inputs so a migration
# before/after read needs NO new push:
#   gh workflow run read-band-config.yml --ref ops/read-band-config \
#     -f probe_columns=collection.updated_at,placement_decision.some_marker \
#     -f count_tables=collection,copy,placement_decision
# On a push (no inputs) it falls back to the defaults declared under `workflow_dispatch`.
#
# READ-ONLY: GETs only, no writes.
#
# !! THIS LOG IS PUBLIC. Karvi made the repo public on 2026-09-17 to lift the Actions minutes cap,
# which VOIDED this file's original premise ("the repo is private, so the log is not public"). Every
# run's output is now world-readable. Consequences, and they are load-bearing for what this prints:
#
#   - Credentials are still safe: `secrets.*` are masked by GitHub, and every value derived from one
#     is `::add-mask::`ed before it can reach a line. Verified no real secret exists anywhere in the
#     315-commit history — `.env*` is gitignored (`!.env.example`), and the only matches are the
#     placeholders in `.env.example` plus `${enc_password}` shell interpolations.
#   - What IS exposed is Karvi's collection: row counts, and the `dex_set_name` values of her
#     unresolved queue (i.e. which products she owns cards from). That is hers, not ours, and she did
#     not publish the repo in order to publish it.
#   - So the rule changed: **card-level identity must not be printed.** A one-off step that dumped
#     card names, tcgdex ids, local ids and line/binder UUIDs for the Dragonair report was REMOVED
#     for this reason once its question was answered. Set-level metadata is retained because it is
#     what actually solved UIL-047, but a future read should prefer counts over names by default and
#     ask before widening.
#
# DELETE ME once UIL-012 closes and any corrective migration is verified. Kept as a separate file
# precisely so it can go without touching the deploy path, and so a diagnostic can never wedge a
# deploy.

on:
  push:
    branches: [ops/read-band-config]
  workflow_dispatch:
    inputs:
      probe_columns:
        description: "table.column pairs to probe for presence, comma-separated (counts and shape only, never values)"
        required: false
        default: "collection.updated_at,line_slot.resolved_decision_kind,line_slot.resolved_decision_choice,placement_decision.line_id,placement_decision.line_slot_id"
      count_tables:
        description: "tables to row-count, comma-separated; a PostgREST filter is allowed (copy?role=eq.shelved)"
        required: false
        default: "collection,copy,wishlist_item,placement_decision,line_slot"
      compare_columns:
        description: "table.colA=colB pairs, comma-separated: counts rows where colA <> colB (tables of <= 500 rows; values never printed)"
        required: false
        default: "collection.updated_at=created_at"

concurrency:
  group: read-band-config
  cancel-in-progress: true

jobs:
  read:
    runs-on: ubuntu-latest
    environment: testing
    timeout-minutes: 5
    steps:
      - name: Read color_band and type_color_map, and verdict them
        env:
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail

          if [ -z "${SERVICE_KEY:-}" ] || [ -z "${PROJECT_REF:-}" ]; then
            echo "::error::Need secrets.SUPABASE_SERVICE_ROLE_KEY and vars.SUPABASE_PROJECT_REF on the 'testing' environment. Both are already configured for the catalog mirror, so an absence here means this job is running against the wrong environment."
            exit 1
          fi

          # KEY FORMAT decides the headers, and getting this wrong looks like an empty table rather
          # than an auth error. A new-format key (`sb_secret_…`) is NOT a JWT and belongs on `apikey`
          # ALONE — sent as a Bearer token Supabase's gateway tries to parse it and rejects with
          # "Invalid JWT". A legacy `service_role` JWT needs the Bearer to be read as that role
          # rather than as anon. Measured: this project is on `sb_secret_…` (mirror run 34787934423).
          rest="https://$PROJECT_REF.supabase.co/rest/v1"
          get() {
            case "$SERVICE_KEY" in
              eyJ*) curl -sS --retry 3 --retry-delay 5 -H "apikey: $SERVICE_KEY" \
                      -H "Authorization: Bearer $SERVICE_KEY" "$rest/$1" ;;
              *)    curl -sS --retry 3 --retry-delay 5 -H "apikey: $SERVICE_KEY" "$rest/$1" ;;
            esac
          }

          # An error body is an object, not an array. Checking the type first means a permissions or
          # gateway failure reports itself instead of being counted as "0 rows", which would read as
          # "the table is empty" and send the reader down entirely the wrong path.
          fetch_table() {
            local path="$1" out="$2"
            get "$path" > "$out"
            if ! jq -e 'type == "array"' "$out" > /dev/null 2>&1; then
              echo "::error::could not read $path — $(jq -rc '.message // .hint // .' "$out" 2>/dev/null | head -c 300). If this mentions \"Invalid JWT\", the key was sent as a Bearer token but is not a JWT."
              exit 1
            fi
          }

          fetch_table "color_band?select=band,display_name,position&order=position.asc" bands.json
          fetch_table "type_color_map?select=card_type,band&order=card_type.asc" map.json

          echo "=============== color_band ($(jq 'length' bands.json) rows) ==============="
          jq -r '.[] | "  \(.position | tostring | (" " * (2 - length)) + .)  \(.band)\(" " * (12 - (.band | length)))\(.display_name)"' bands.json
          echo
          echo "=============== type_color_map ($(jq 'length' map.json) rows) ==============="
          jq -r '.[] | "  \(.card_type)\(" " * (12 - (.card_type | length)))-> \(.band)"' map.json
          echo

          # ---- Verdict. A dump alone puts the interpretation on whoever reads the log; these are
          # the four things that actually distinguish the hypotheses, so assert them here.
          fail=0

          # 1. The ten key-form bands from 0003_config.sql.
          expected_bands='["dark_blue","green","light_blue","olive","orange","pink","purple","red","white","yellow"]'
          actual_bands=$(jq -c '[.[].band] | sort' bands.json)
          if [ "$actual_bands" != "$expected_bands" ]; then
            echo "::error::color_band does not hold exactly the ten key-form bands from 0003_config.sql."
            echo "  expected: $expected_bands"
            echo "  actual:   $actual_bands"
            fail=1
          fi

          # 2. Any capitalised band key is a hand-entered display-name row that 0003's
          #    `on conflict do nothing` would have sat alongside rather than replaced.
          caps=$(jq -rc '[.[].band | select(test("[A-Z]"))]' bands.json)
          if [ "$caps" != "[]" ]; then
            echo "::error::color_band contains DISPLAY-NAME keys: $caps. 0003_config.sql inserts key-form bands with 'on conflict do nothing', so these were added separately and the migration skipped past them. A corrective migration has to displace them, not politely skip them."
            fail=1
          fi

          # 3. The fourteen mappings from 0003_config.sql. A MISSING row is the trigger for
          #    UIL-012 — it is what makes band() fall through to the literal "White".
          expected_types='["Colorless","Darkness","Dragon","Fairy","Fighting","Fire","Grass","Item","Lightning","Metal","Psychic","Supporter","Trainer","Water"]'
          actual_types=$(jq -c '[.[].card_type] | sort' map.json)
          if [ "$actual_types" != "$expected_types" ]; then
            echo "::error::type_color_map does not hold exactly the fourteen card types from 0003_config.sql. A MISSING row is the UIL-012 trigger: any card whose effective type is absent here makes lib/engine/bands.ts return the display name \"White\", which is not in color_band, and the copy insert fails with 23503."
            echo "  expected: $expected_types"
            echo "  actual:   $actual_types"
            echo "  missing:  $(jq -nc --argjson e "$expected_types" --argjson a "$actual_types" '$e - $a')"
            echo "  extra:    $(jq -nc --argjson e "$expected_types" --argjson a "$actual_types" '$a - $e')"
            fail=1
          fi

          # 4. Referential sanity. The FK should make this impossible, so a hit here means the
          #    constraint is missing on this environment, which is a much bigger finding.
          orphans=$(jq -nc --slurpfile m map.json --slurpfile b bands.json \
            '[$m[0][] | . as $r | select(([$b[0][].band] | index($r.band)) == null) | {card_type, band}]')
          if [ "$orphans" != "[]" ]; then
            echo "::error::type_color_map rows point at bands absent from color_band: $orphans. The FK `type_color_map.band references color_band (band)` should make this impossible, so the constraint is missing on this environment — a bigger problem than UIL-012."
            fail=1
          fi

          if [ "$fail" -eq 0 ]; then
            echo "VERDICT: both config tables match 0003_config.sql exactly — ten key-form bands, fourteen mappings, no orphans."
            echo "So the data is NOT the trigger, and UIL-012 needs another explanation. Next place to look: whether anything other than lib/plan/context.ts builds the map (a caller passing DEFAULT_TYPE_COLOR_MAP, which is display-form, would produce this error for EVERY card), and whether the failing commit ran through a path that bypasses loadPlanContext."
            exit 0
          fi

          echo "::error::VERDICT: the config tables diverge from 0003_config.sql — see the errors above. A corrective migration is needed, and it must UPDATE or DELETE the bad rows rather than 'insert ... on conflict do nothing', which is what let this persist."
          exit 1

      # UIL-029 severity check. `unresolvedEntryRepo.listWaiting` (lib/repo/sync.ts:29-33) is a bare
      # `select("*").eq("status","WAITING")` with NO `.range()`, so it is subject to PostgREST's
      # 1000-row cap. lib/sync/pipeline.ts:146 drives archive/drop reconciliation off that list, so
      # every entry past row 1000 is silently never archived when the catalog resolves it and never
      # dropped when it leaves her export — the queue stops self-healing while the Sync screen still
      # promises it will. Whether that is LIVE or merely LATENT is one number.
      #
      # COUNTS ONLY. `Prefer: count=exact` with `Range: 0-0` returns the total in the Content-Range
      # header and no rows, so nothing about the contents of her collection is printed.
      - name: Count unresolved_entry (severity for the unpaged listWaiting)
        env:
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          rest="https://$PROJECT_REF.supabase.co/rest/v1"

          count_of() {
            local query="$1" headers total
            case "$SERVICE_KEY" in
              eyJ*) headers=$(curl -sS -D - -o /dev/null --retry 3 --retry-delay 5 \
                      -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY" \
                      -H "Prefer: count=exact" -H "Range: 0-0" "$rest/$query") ;;
              *)    headers=$(curl -sS -D - -o /dev/null --retry 3 --retry-delay 5 \
                      -H "apikey: $SERVICE_KEY" \
                      -H "Prefer: count=exact" -H "Range: 0-0" "$rest/$query") ;;
            esac
            # content-range is "0-0/1234"; the total follows the slash.
            total=$(printf '%s' "$headers" | tr -d '\r' \
              | awk 'tolower($1) == "content-range:" { split($2, a, "/"); print a[2] }')
            printf '%s' "${total:-unknown}"
          }

          waiting=$(count_of "unresolved_entry?select=id&status=eq.WAITING")
          allrows=$(count_of "unresolved_entry?select=id")
          echo "unresolved_entry total:    $allrows"
          echo "unresolved_entry WAITING:  $waiting"

          if [ "$waiting" = "unknown" ] || [ "$allrows" = "unknown" ]; then
            echo "::warning::could not read a count for unresolved_entry — severity undetermined. Not failing: the band-config verdict above is this job's primary purpose."
            exit 0
          fi

          # PostgREST's default max-rows is 1000. At or above it, listWaiting is already truncating.
          if [ "$waiting" -ge 1000 ]; then
            echo "::error::LIVE, not latent — $waiting WAITING entries is at or past PostgREST's 1000-row cap, so listWaiting is ALREADY truncating and entries past row 1000 can never be archived or dropped. Re-rank UIL-029 and page it."
            exit 1
          fi
          echo "VERDICT: $waiting WAITING entries, under the 1000-row cap — the unpaged listWaiting is LATENT, not live. Reconciliation is currently reaching every entry."
          echo "Headroom before it bites: $((1000 - waiting)) more WAITING entries."

          # ---- Second unpaged call site: copyRepo.listUnplaced (lib/repo/copy.ts:46-57), which feeds
          # the Haul Plan's pending-placement queue (UIL-003's fix). Same 1000-row cap.
          #
          # COUNT THE PRE-FILTER SET, which is what the cap applies to. `loadPendingPlacements`
          # subtracts copies that already hold a `placement_decision` AFTER the query returns
          # (lib/plan/pending.ts:50-57), so truncation happens first, on the larger set. Counting only
          # the "actually pending" remainder would understate the risk.
          unplaced=$(count_of "copy?select=id&role=eq.bulk&binder_id=is.null&line_slot_id=is.null")
          decisions=$(count_of "placement_decision?select=id")
          echo
          echo "copy WHERE role=bulk AND binder_id IS NULL AND line_slot_id IS NULL: $unplaced"
          echo "placement_decision rows (total):                                     $decisions"

          if [ "$unplaced" = "unknown" ]; then
            echo "::warning::could not read a count for unplaced copies — that half is undetermined."
            exit 0
          fi
          if [ "$unplaced" -ge 1000 ]; then
            echo "::error::LIVE — $unplaced rows match listUnplaced, at or past the 1000-row cap, so copies past row 1000 never reach the Haul Plan and can never be placed. Silent. Re-rank and page it."
            exit 1
          fi
          echo "VERDICT: $unplaced unplaced-shaped copies, under the cap — listUnplaced is LATENT too."
          echo "Headroom: $((1000 - unplaced)) more."

          # ---- Is the WAITING queue benign, and has reconciliation ever actually RUN?
          #
          # `total == WAITING` with zero RESOLVED/DISMISSED could mean the archive/drop path has never
          # executed against real data, OR that it runs every sync and correctly finds nothing to
          # archive because these entries are genuinely unresolvable. `retry_count` settles it
          # DIRECTLY: the auto-retry is what bumps it, so a non-zero count is proof the pipeline has
          # processed these rows rather than never reaching them. That is stronger evidence than
          # inferring from the absence of archived rows.
          #
          # WHAT IS PRINTED. `reason` is a CHECK-constrained enum (UNKNOWN_SET / UNKNOWN_CARD),
          # `retry_count` is an integer, `last_retry_sync` a timestamp. `dex_set_name` is SET-level
          # metadata from the Dex export, not card identity — no card name, number or quantity is
          # printed. Judged in-bounds to answer "are these the zero-card pseudo-sets?" definitively in
          # one run rather than costing a second push; say so if you'd rather it were omitted.
          echo
          echo "--- the WAITING entries, aggregated (no card identities) ---"
          rows=$(case "$SERVICE_KEY" in
            eyJ*) curl -sS --retry 3 -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY" \
                    "$rest/unresolved_entry?select=reason,retry_count,last_retry_sync,dex_set_name&status=eq.WAITING" ;;
            *)    curl -sS --retry 3 -H "apikey: $SERVICE_KEY" \
                    "$rest/unresolved_entry?select=reason,retry_count,last_retry_sync,dex_set_name&status=eq.WAITING" ;;
          esac)
          if ! printf '%s' "$rows" | jq -e 'type == "array"' > /dev/null 2>&1; then
            echo "::warning::could not read the WAITING entries — reason breakdown undetermined. Counts above stand."
            exit 0
          fi
          echo "by reason:"
          printf '%s' "$rows" | jq -r 'group_by(.reason)[] | "  \(.[0].reason): \(length)"'
          echo "by dex set name:"
          printf '%s' "$rows" | jq -r 'group_by(.dex_set_name)[] | "  \(.[0].dex_set_name // "(null)"): \(length)"'
          echo "retry_count: min=$(printf '%s' "$rows" | jq '[.[].retry_count] | min') max=$(printf '%s' "$rows" | jq '[.[].retry_count] | max')"
          echo "rows with a last_retry_sync set: $(printf '%s' "$rows" | jq '[.[] | select(.last_retry_sync != null)] | length') of $(printf '%s' "$rows" | jq 'length')"
          maxretry=$(printf '%s' "$rows" | jq '[.[].retry_count] | max')
          if [ "${maxretry:-0}" -gt 0 ]; then
            echo "VERDICT: retry_count reaches $maxretry, so the auto-retry HAS processed these rows — the reconciliation path is exercised, not unexercised. They stay WAITING because they genuinely do not resolve."
          else
            echo "VERDICT: every retry_count is 0, so these rows have NEVER been re-examined by a sync — the archive/drop path really may be unexercised. Worth deliberately exercising."
          fi

              # ---- UIL-026: did migration 0009's two columns actually POPULATE? A green catalog-mirror run
          # proves nothing here — without `force_all: true` the resume check skips every set and exits 0
          # having written nothing, which is UIL-004's exact failure shape. So count the NON-NULLs and
          # spot-check the row the acceptance test turns on.
          echo
          echo "--- UIL-026 set metadata: did 0009's columns actually populate? ---"
          copies_total=$(count_of "catalog_card?select=tcgdex_id")
          with_count=$(count_of "catalog_card?select=tcgdex_id&set_card_count_official=not.is.null")
          with_date=$(count_of "catalog_card?select=tcgdex_id&set_release_date=not.is.null")
          echo "catalog_card rows:                     $copies_total"
          echo "  set_card_count_official NOT NULL:    $with_count"
          echo "  set_release_date        NOT NULL:    $with_date"

          # The acceptance row: Minior, Paradox Rift. Its set's official count must read 182 — the
          # denominator she types in `099/182` — or the ranking has nothing to match on. `get()` lives
          # in the first step's shell, so this step does its own request.
          minior_url="$rest/catalog_card?tcgdex_id=eq.sv04-099&select=tcgdex_id,name,local_id,set_card_count_official,set_release_date"
          case "$SERVICE_KEY" in
            eyJ*) minior=$(curl -sS --retry 3 -H "apikey: $SERVICE_KEY" \
                    -H "Authorization: Bearer $SERVICE_KEY" "$minior_url") ;;
            *)    minior=$(curl -sS --retry 3 -H "apikey: $SERVICE_KEY" "$minior_url") ;;
          esac
          echo "acceptance row: $(printf '%s' "$minior" | jq -c '.[0] // "NOT FOUND"' 2>/dev/null || echo '(unreadable)')"

          if [ "$with_count" = "unknown" ] || [ "$with_count" -eq 0 ]; then
            echo "::error::set_card_count_official is NULL on every row — the mirror ran without force_all, so 0009's columns were never populated. A green mirror run does NOT mean this shipped."
          elif [ "$with_count" -lt "$copies_total" ]; then
            echo "::warning::$with_count of $copies_total rows have a card count — partial. The $((copies_total - with_count)) without one are sets TCGdex omits the field for; they order last by design, but worth knowing which."
          else
            echo "VERDICT: set_card_count_official populated on all $with_count rows."
          fi
          if [ "$with_date" != "unknown" ] && [ "$with_date" -lt "$copies_total" ]; then
            echo "::warning::set_release_date present on only $with_date of $copies_total rows — the sampled-coverage caveat was real. NULLs order last, so this degrades rather than breaks."
          fi

          # ---- UIL-061: line_slot / copy referential drift.
          #
          # A new line's auto-pull can take a copy that already fills another line's slot, overwriting
          # `copy.line_slot_id` and leaving the OLD slot still `filled` while pointing at a copy that
          # has moved on. Two shapes of orphan:
          #   A. state='filled' with copy_id NULL           — filled but pointing at nothing
          #   B. state='filled' whose copy has moved        — copy.line_slot_id != this slot's id
          #      (or the copy row is missing entirely)
          # PostgREST cannot join, so both sides are fetched and compared here. Counts and slot STATES
          # only — no card identity, no catalog ids.
          echo
          echo "--- UIL-061: line_slot referential integrity ---"
          fetch_rows_early() {
            case "$SERVICE_KEY" in
              eyJ*) curl -sS --retry 3 --retry-delay 5 -H "apikey: $SERVICE_KEY" \
                      -H "Authorization: Bearer $SERVICE_KEY" "$rest/$1" ;;
              *)    curl -sS --retry 3 --retry-delay 5 -H "apikey: $SERVICE_KEY" "$rest/$1" ;;
            esac
          }
          slots=$(fetch_rows_early "line_slot?select=id,state,copy_id")
          slotcopies=$(fetch_rows_early "copy?select=id,line_slot_id&line_slot_id=not.is.null")
          lines_total=$(count_of "evolution_line?select=id")
          if printf '%s' "$slots" | jq -e 'type == "array"' > /dev/null 2>&1 \
             && printf '%s' "$slotcopies" | jq -e 'type == "array"' > /dev/null 2>&1; then
            echo "evolution_line rows: $lines_total"
            echo "line_slot rows:      $(printf '%s' "$slots" | jq 'length')"
            echo "by state:"
            printf '%s' "$slots" | jq -r 'group_by(.state)[] | "  \(.[0].state): \(length)"'
            echo "copies claiming a line slot: $(printf '%s' "$slotcopies" | jq 'length')"

            # A: filled, no copy_id.
            orphan_a=$(printf '%s' "$slots" | jq '[.[] | select(.state == "filled" and .copy_id == null)] | length')
            # B: filled, has copy_id, but that copy does not point back at this slot.
            orphan_b=$(jq -n --argjson s "$slots" --argjson c "$slotcopies" '
              ($c | map({key: .id, value: .line_slot_id}) | from_entries) as $back
              | [ $s[]
                  | select(.state == "filled" and .copy_id != null)
                  | select(($back[.copy_id] // null) != .id) ] | length')
            # Inverse, worth knowing: a copy pointing at a slot that is not filled by it.
            dangling_copy=$(jq -n --argjson s "$slots" --argjson c "$slotcopies" '
              ($s | map({key: .id, value: .copy_id}) | from_entries) as $fwd
              | [ $c[] | select(($fwd[.line_slot_id] // null) != .id) ] | length')

            echo "A. filled slots with copy_id NULL:            $orphan_a"
            echo "B. filled slots whose copy moved away:        $orphan_b"
            echo "C. copies pointing at a slot not holding them: $dangling_copy"
            if [ "$((orphan_a + orphan_b + dangling_copy))" -eq 0 ]; then
              echo "VERDICT: no line_slot/copy drift — nothing to repair, so no cleanup entry needed."
            else
              echo "::warning::line_slot drift present (A=$orphan_a B=$orphan_b C=$dangling_copy) — a repair item is warranted. C is the inverse of B and would indicate the overwrite happened without the old slot being cleared."
            fi

            # SPLIT THE B CASES — this decides WHICH write path leaks. The earlier `slotcopies` query
            # filtered `line_slot_id=not.is.null`, so a copy whose slot pointer is now NULL is
            # indistinguishable from one that moved to a different slot. Re-fetch the drifted copies
            # with NO null filter:
            #   all NULL              -> a move-out / unshelve path that never clears the slot
            #   any pointing elsewhere -> line-new's auto-pull overwriting without clearing (UIL-061)
            # Prints role and whether a binder is set — structural, no card identity, no copy ids.
            if [ "$orphan_b" -gt 0 ]; then
              drifted=$(jq -rn --argjson s "$slots" --argjson c "$slotcopies" '
                ($c | map({key: .id, value: .line_slot_id}) | from_entries) as $back
                | [ $s[] | select(.state == "filled" and .copy_id != null)
                    | select(($back[.copy_id] // null) != .id) | .copy_id ] | join(",")')
              detail=$(fetch_rows_early "copy?select=id,line_slot_id,role,binder_id&id=in.($drifted)")
              if printf '%s' "$detail" | jq -e 'type == "array"' > /dev/null 2>&1; then
                echo "  the $orphan_b drifted copies, by shape:"
                # Classify FIRST, then group on the classification. Grouping on `line_slot_id == null`
                # alone merges "points at another existing slot" with "points at a slot that no longer
                # exists" and then labels both from the group's first row — a silent mislabel.
                printf '%s' "$detail" | jq -r --argjson s "$slots" '
                  ($s | map(.id)) as $slotids
                  | map(. as $r | {
                      where: (if $r.line_slot_id == null then "NULL"
                              elif ($slotids | index($r.line_slot_id)) != null then "another existing slot"
                              else "a slot that no longer exists" end),
                      role: $r.role,
                      binder: (if $r.binder_id == null then "none" else "set" end)
                    })
                  | group_by([.where, .role, .binder])[]
                  | "    line_slot_id=\(.[0].where)  role=\(.[0].role)  binder=\(.[0].binder)  x\(length)"'
                nulls=$(printf '%s' "$detail" | jq '[.[] | select(.line_slot_id == null)] | length')
                elsewhere=$(printf '%s' "$detail" | jq '[.[] | select(.line_slot_id != null)] | length')
                echo "  line_slot_id NULL: $nulls    pointing at a different slot: $elsewhere"
                if [ "$elsewhere" -eq 0 ]; then
                  echo "  VERDICT: all $nulls have a NULL slot pointer — the leak is a MOVE-OUT/UNSHELVE path that never clears line_slot, NOT line-new's auto-pull."
                elif [ "$nulls" -eq 0 ]; then
                  echo "  VERDICT: all $elsewhere point at a different slot — this is line-new's auto-pull overwriting copy.line_slot_id without clearing the old slot (UIL-061 as designed-for)."
                else
                  echo "  VERDICT: BOTH paths leak — $nulls via a move-out that leaves the slot filled, $elsewhere via an auto-pull that does not clear the old slot. Two fixes, not one."
                fi
              else
                echo "::warning::could not re-fetch the drifted copies — B remains unsplit."
              fi

              # ---- DID THEY EVER LEAVE? FSD-2 traced every Move path on develop and found they all
              # reopen the vacated slot, so "moved out, slot not cleared" may be wrong. The alternative
              # is that the copy NEVER received its line_slot_id at commit time — a deferred-pointer
              # miss in the haul commit's line-new / fill-existing-slot write.
              #
              # The discriminator is geometry. `evolution_line.half` is `check (half = 'back')`, so a
              # line ALWAYS lives in the back half of its binder. So if a drifted copy sits in the SAME
              # binder, in the BACK half, in the SAME band as its slot's line, it is exactly where that
              # slot would have put it — it never left, and the pointer was simply never written.
              # A different binder, the front half, or a different band means it genuinely moved.
              #
              # NOTE: `line_slot` has no `created_at` column, so the slot-vs-decision timestamp compare
              # is not available. `evolution_line.created_at` is, and is used instead.
              echo "  did they ever leave? (line.half is always 'back', so geometry decides)"
              naming=$(jq -rn --argjson s "$slots" --argjson c "$slotcopies" '
                ($c | map({key: .id, value: .line_slot_id}) | from_entries) as $back
                | [ $s[] | select(.state == "filled" and .copy_id != null)
                    | select(($back[.copy_id] // null) != .id) ] ')
              slot_ids=$(printf '%s' "$naming" | jq -r '[.[].id] | join(",")')
              slotrows=$(fetch_rows_early "line_slot?select=id,line_id,copy_id,stage_index&id=in.($slot_ids)")
              line_ids=$(printf '%s' "$slotrows" | jq -r '[.[].line_id] | unique | join(",")')
              linerows=$(fetch_rows_early "evolution_line?select=id,color_band,binder_id,half,created_at&id=in.($line_ids)")
              copyrows=$(fetch_rows_early "copy?select=id,binder_id,binder_half,color_band,role,line_slot_id&id=in.($drifted)")
              # `placement_decision.copy_id` is the ONLY copy reference on the table (0002:222-231) —
              # there is no separate incoming/draft id — so this is the whole picture per copy.
              #
              # HYPOTHESIS BEING TESTED: a SECOND "Done" on an already-placed copy (a plan resumed from
              # sessionStorage still listing it) re-runs the incoming-copy write with `line_slot_id`
              # null and re-shelves it, leaving the slot filled and naming it. >=2 decisions on ANY of
              # the five confirms it; exactly 1 each refutes it.
              decisions=$(fetch_rows_early "placement_decision?select=copy_id,created_at,decision,resolved_by,haul_id&copy_id=in.($drifted)&order=created_at.asc")
              if printf '%s' "$decisions" | jq -e 'type == "array"' > /dev/null 2>&1; then
                echo "  placement_decision rows per drifted copy:"
                printf '%s' "$decisions" | jq -r '
                  group_by(.copy_id)
                  | map(length)
                  | group_by(.)[]
                  | "    \(.[0]) decision(s): \(length) cop(y|ies)"'
                echo "  distinct drifted copies with >=1 decision: $(printf '%s' "$decisions" | jq '[.[].copy_id] | unique | length') of 5"
                echo "  by (decision, resolved_by):"
                printf '%s' "$decisions" | jq -r 'group_by([.decision, .resolved_by])[] | "    \(.[0].decision) / \(.[0].resolved_by)  x\(length)"'
                echo "  distinct haul_ids across them: $(printf '%s' "$decisions" | jq '[.[].haul_id] | unique | length')"
                maxdec=$(printf '%s' "$decisions" | jq '[group_by(.copy_id)[] | length] | max // 0')
                if [ "${maxdec:-0}" -ge 2 ]; then
                  echo "  VERDICT: at least one drifted copy has $maxdec decisions — CONFIRMS the double-Done hypothesis (a resumed plan re-committing an already-placed copy)."
                else
                  echo "  VERDICT: every drifted copy has exactly one decision — REFUTES the double-Done hypothesis. The pointer was missed on the FIRST and only commit, not overwritten by a second."
                fi
              else
                echo "::warning::could not read placement_decision for the drifted copies."
              fi
              if printf '%s' "$slotrows" | jq -e 'type == "array"' > /dev/null 2>&1 \
                 && printf '%s' "$linerows" | jq -e 'type == "array"' > /dev/null 2>&1 \
                 && printf '%s' "$copyrows" | jq -e 'type == "array"' > /dev/null 2>&1; then
                jq -rn --argjson sl "$slotrows" --argjson ln "$linerows" --argjson cp "$copyrows" '
                  ($ln | map({key: .id, value: .}) | from_entries)  as $lineById
                  | ($cp | map({key: .id, value: .}) | from_entries) as $copyById
                  | [ $sl[]
                      | . as $slot
                      | ($lineById[$slot.line_id]) as $line
                      | ($copyById[$slot.copy_id]) as $copy
                      | {
                          same_binder: ($copy != null and $line != null and $copy.binder_id == $line.binder_id),
                          back_half:   ($copy != null and $copy.binder_half == "back"),
                          same_band:   ($copy != null and $line != null and $copy.color_band == $line.color_band),
                          line_half:   ($line.half // "?")
                        } ]
                  | map(. + {verdict: (if (.same_binder and .back_half and .same_band)
                                       then "NEVER LEFT (pointer never written)"
                                       else "genuinely moved out" end)})
                  | group_by([.verdict, .same_binder, .back_half, .same_band])[]
                  | "    \(.[0].verdict)  [same_binder=\(.[0].same_binder) back_half=\(.[0].back_half) same_band=\(.[0].same_band)]  x\(length)"'
                echo "  earliest/latest placement_decision on these copies: $(printf '%s' "$decisions" | jq -r 'if type=="array" and length>0 then "\(.[0].created_at) .. \(.[-1].created_at)  (\(length) rows)" else "none" end')"
                echo "  their lines were created: $(printf '%s' "$linerows" | jq -r '[.[].created_at] | if length>0 then "\(min) .. \(max)" else "?" end')"
              else
                echo "::warning::could not read the slot/line/copy triple — the never-left check is undetermined."
              fi
            fi
          else
            echo "::warning::could not read line_slot or copy — UIL-061 integrity undetermined."
          fi

          # ---- UIL-062 SHAPE 3, the user-visible one: a copy physically in a line (back half) whose
          # `line_slot_id` is NULL and whose slot was never filled at all — so the Lines page still
          # shows that stage HUNTING after she pressed Done. Invisible to the B count, which only sees
          # a FILLED slot whose copy left. This is the shape Karvi reported on Dragonair.
          #
          # Structural only: counts, plus binder/band agreement and an exact intended-slot match via a
          # placeholder's `target_catalog_card_id`. No card names.
          echo
          echo "--- UIL-062 shape 3: back-half copies with no slot pointer (the HUNTING symptom) ---"
          orphan_copies=$(count_of "copy?select=id&role=eq.shelved&binder_half=eq.back&line_slot_id=is.null")
          echo "copies role=shelved, binder_half=back, line_slot_id NULL: $orphan_copies"
          oc_rows=$(fetch_rows_early "copy?select=id,catalog_card_id,binder_id,color_band,variant,dex_variant_raw,created_at&role=eq.shelved&binder_half=eq.back&line_slot_id=is.null&limit=1000")
          ph_rows=$(fetch_rows_early "line_slot?select=id,line_id,target_catalog_card_id&state=eq.placeholder")
          all_lines=$(fetch_rows_early "evolution_line?select=id,binder_id,color_band,root_dex_id")
          if printf '%s' "$oc_rows" | jq -e 'type == "array"' > /dev/null 2>&1 \
             && printf '%s' "$ph_rows" | jq -e 'type == "array"' > /dev/null 2>&1 \
             && printf '%s' "$all_lines" | jq -e 'type == "array"' > /dev/null 2>&1; then
            echo "placeholder slots available: $(printf '%s' "$ph_rows" | jq 'length')"
            jq -rn --argjson oc "$oc_rows" --argjson ph "$ph_rows" --argjson ln "$all_lines" '
              ($ln | map({key: .id, value: .}) | from_entries) as $lineById
              # Placeholder slots annotated with their line geometry.
              | ([ $ph[] | . as $s | ($lineById[$s.line_id]) as $l
                   | select($l != null)
                   | {binder: $l.binder_id, band: $l.color_band, target: $s.target_catalog_card_id} ]) as $slots
              | [ $oc[]
                  | . as $c
                  | {
                      exact:  ([ $slots[] | select(.binder == $c.binder_id and .band == $c.color_band and .target == $c.catalog_card_id) ] | length),
                      geo:    ([ $slots[] | select(.binder == $c.binder_id and .band == $c.color_band) ] | length)
                    } ]
              | {
                  total: length,
                  with_exact_intended_slot: ([ .[] | select(.exact > 0) ] | length),
                  with_same_binder_band_placeholder_only: ([ .[] | select(.exact == 0 and .geo > 0) ] | length),
                  no_candidate_slot: ([ .[] | select(.geo == 0) ] | length)
                }
              | "  affected copies scanned:                      \(.total)",
                "  with an EXACT intended placeholder (same binder+band, target = this card): \(.with_exact_intended_slot)",
                "  same binder+band placeholder but different target:                        \(.with_same_binder_band_placeholder_only)",
                "  no placeholder in that binder+band at all:                                \(.no_candidate_slot)"'
            # ---- PAIRING CARDINALITY, the relink migration's guard input.
            #
            # "N have an exact intended placeholder" is an EXISTENCE claim; a safe relink needs a
            # UNIQUENESS claim. Two ways a naive pairing would guess:
            #   - two unlinked copies of one card against one placeholder  -> which copy?
            #   - two placeholders wanting one card in one binder+band     -> which slot?
            # So report, per affected copy, how many placeholders match it AND how many copies match
            # that placeholder, and count how many are strictly 1:1 in BOTH directions.
            echo "  pairing cardinality (the relink guard's input):"
            jq -rn --argjson oc "$oc_rows" --argjson ph "$ph_rows" --argjson ln "$all_lines" '
              ($ln | map({key: .id, value: .}) | from_entries) as $lineById
              | ([ $ph[] | . as $s | ($lineById[$s.line_id]) as $l | select($l != null)
                   | {slot: $s.id, binder: $l.binder_id, band: $l.color_band, target: $s.target_catalog_card_id} ]) as $slots
              # For each affected copy: the slots that match it on binder+band+card.
              | [ $oc[]
                  | . as $c
                  | ([ $slots[] | select(.binder == $c.binder_id and .band == $c.color_band and .target == $c.catalog_card_id) ]) as $ms
                  | {
                      copy: $c.id,
                      slots_matching_this_copy: ($ms | length),
                      # When exactly one slot matches, how many affected copies does THAT slot match?
                      copies_matching_that_slot: (
                        if ($ms | length) == 1
                        then ($ms[0]) as $s
                             | ([ $oc[] | select(.binder_id == $s.binder and .color_band == $s.band and .catalog_card_id == $s.target) ] | length)
                        else null end)
                    } ]
              | . as $rows
              | ([ $rows[] | select(.slots_matching_this_copy == 1 and .copies_matching_that_slot == 1) ] | length) as $oneone
              | ([ $rows[] | select(.slots_matching_this_copy > 1) ] | length) as $manyslots
              | ([ $rows[] | select(.slots_matching_this_copy == 1 and (.copies_matching_that_slot // 0) > 1) ] | length) as $manycopies
              | ([ $rows[] | select(.slots_matching_this_copy == 0) ] | length) as $noslot
              | "    strictly 1:1 (safe to relink):                        \($oneone)",
                "    one slot but SEVERAL copies want it (ambiguous):      \($manycopies)",
                "    SEVERAL slots match this copy (ambiguous):            \($manyslots)",
                "    no matching slot (stays hers):                        \($noslot)",
                "    -> migration would relink \($oneone) of \($rows | length); \($manycopies + $manyslots) skipped as ambiguous, \($noslot) have no candidate"'

            # ---- ARE THE COMPETING COPIES FUNGIBLE? For the "one slot, several copies" cases, the
            # copies share a `catalog_card_id` — which is all `target_catalog_card_id` matches on — but
            # `copy.variant` is per-copy and the slot says nothing about it. So:
            #   variants IDENTICAL -> genuinely interchangeable; a created_at tie-break puts a correct
            #                         card in the slot and the pair could be relinked at no cost.
            #   variants DIFFER    -> which printing sits in the line is HER call (a reverse holo in a
            #                         display line is not the same thing as a plain one), so they stay
            #                         hers rather than becoming a deferred repair.
            echo "  are the competing copies fungible? (variant check on the ambiguous groups)"
            jq -rn --argjson oc "$oc_rows" --argjson ph "$ph_rows" --argjson ln "$all_lines" '
              ($ln | map({key: .id, value: .}) | from_entries) as $lineById
              | ([ $ph[] | . as $s | ($lineById[$s.line_id]) as $l | select($l != null)
                   | {binder: $l.binder_id, band: $l.color_band, target: $s.target_catalog_card_id} ]) as $slots
              # Groups of affected copies sharing (binder, band, card) that ONE placeholder wants.
              | [ $oc[] | {binder: .binder_id, band: .color_band, card: .catalog_card_id,
                           variant: .variant, raw: .dex_variant_raw, created: .created_at} ]
              | group_by([.binder, .band, .card])
              | [ .[]
                  | . as $grp
                  | ($grp[0]) as $k
                  | ([ $slots[] | select(.binder == $k.binder and .band == $k.band and .target == $k.card) ] | length) as $nslots
                  | select(($grp | length) > 1 and $nslots == 1)
                  | {
                      copies: ($grp | length),
                      distinct_variants: ([ $grp[].variant ] | unique | length),
                      variants: ([ $grp[].variant ] | unique),
                      distinct_raw: ([ $grp[].raw ] | unique | length),
                      oldest: ([ $grp[].created ] | min)
                    } ]
              | if length == 0 then "    (no one-slot-many-copies groups found)"
                else
                  (.[] | "    group of \(.copies) copies · distinct variant=\(.distinct_variants) \(.variants | tostring) · distinct dex_variant_raw=\(.distinct_raw) · oldest \(.oldest)"),
                  (if ([ .[] | select(.distinct_variants > 1 or .distinct_raw > 1) ] | length) == 0
                   then "    VERDICT: every competing pair shares its variant — genuinely FUNGIBLE. A created_at tie-break puts a correct card in the slot; relinking these is safe and needs no decision from her."
                   else "    VERDICT: at least one competing pair DIFFERS in variant — NOT fungible. Which printing sits in the line is her call; leave these to her rather than tie-breaking." end)
                end'

            if [ "$orphan_copies" != "unknown" ] && [ "$orphan_copies" -gt 5 ]; then
              echo "::warning::$orphan_copies back-half copies have no slot pointer — materially MORE than the 5 filled-slot orphans. This is the shape she can see (stage reads HUNTING after Done), and it is the real blast radius."
            fi
          else
            echo "::warning::could not read the shape-3 triple — undetermined."
          fi

          # ---- UIL-047: does a learned set alias survive and apply on a re-import?
          #
          # THE JOIN KEY IS NOT dex_set_name. `set_alias` is keyed `(locale, dex_code)` where
          # `dex_code` is `parseDexId(entry.dex_id).rawCode` — the SET CODE before the dash, with a
          # `jpn_` prefix stripped (resolve.ts:36-44, exec.ts:441-446). So `me25-011` → `me25`, and the
          # alias maps `en:me25` → `me02.5`. Comparing against the human `dex_set_name` ("Ascended
          # Heroes") would never match and would read as "alias absent" when it is present.
          #
          # Prints set CODES and set-level alias rows only — no card names, numbers or quantities.
          echo
          echo "--- UIL-047: learned aliases vs still-WAITING set codes ---"
          # `get()` lives in the first step's shell; this step needs its own.
          fetch_rows() {
            case "$SERVICE_KEY" in
              eyJ*) curl -sS --retry 3 --retry-delay 5 -H "apikey: $SERVICE_KEY" \
                      -H "Authorization: Bearer $SERVICE_KEY" "$rest/$1" ;;
              *)    curl -sS --retry 3 --retry-delay 5 -H "apikey: $SERVICE_KEY" "$rest/$1" ;;
            esac
          }
          aliases=$(fetch_rows "set_alias?select=locale,dex_code,tcgdex_set_id,source,created_at&order=created_at.asc")
          if printf '%s' "$aliases" | jq -e 'type == "array"' > /dev/null 2>&1; then
            echo "set_alias rows: $(printf '%s' "$aliases" | jq 'length')"
            printf '%s' "$aliases" | jq -r '.[] | "  \(.locale):\(.dex_code) -> \(.tcgdex_set_id)  [\(.source)] \(.created_at)"'
          else
            echo "::warning::could not read set_alias — UIL-047 undetermined."
            aliases='[]'
          fi

          waiting_rows=$(fetch_rows "unresolved_entry?select=locale,dex_id,reason&status=eq.WAITING")
          if printf '%s' "$waiting_rows" | jq -e 'type == "array"' > /dev/null 2>&1; then
            # rawCode = text before the first dash, `jpn_` stripped. Locale normalises the way
            # exec.ts does: "ja" or "Japanese" -> ja, everything else -> en.
            echo "waiting entries by (locale:setCode, reason), and whether an alias exists:"
            printf '%s' "$waiting_rows" | jq -r --argjson al "$aliases" '
              ($al | map("\(.locale):\(.dex_code)")) as $keys
              | .[]
              | ((.locale // "") | if . == "ja" or . == "Japanese" then "ja" else "en" end) as $loc
              | ((.dex_id // "") | sub("^jpn_"; "") | split("-")[0]) as $code
              | "  \($loc):\($code)\t\(.reason)\t" + (if ($keys | index("\($loc):\($code)")) then "ALIASED" else "no alias" end)
            ' | sort | uniq -c | sed 's/^/  /'
            aliased=$(printf '%s' "$waiting_rows" | jq --argjson al "$aliases" '
              ($al | map("\(.locale):\(.dex_code)")) as $keys
              | [ .[]
                  | ((.locale // "") | if . == "ja" or . == "Japanese" then "ja" else "en" end) as $loc
                  | ((.dex_id // "") | sub("^jpn_"; "") | split("-")[0]) as $code
                  | select($keys | index("\($loc):\($code)")) ] | length')
            total_waiting=$(printf '%s' "$waiting_rows" | jq 'length')
            echo "waiting AND aliased:     $aliased"
            echo "waiting AND not aliased: $((total_waiting - aliased))"
            if [ "$aliased" -gt 0 ]; then
              echo "::warning::$aliased WAITING entr(ies) DO have a matching set_alias, so the alias exists but did not resolve the row at import. Expected path: pipeline.ts:166 resolveDexId(r, aliasMap) -> catalog-lookup; a resolved set that misses the card should report UNKNOWN_CARD, not UNKNOWN_SET. Check the reason column above."
            else
              echo "VERDICT: no WAITING entry has a matching alias — nothing contradicts 'one match drains the set'. These are simply set codes nobody has taught yet."
            fi
          else
            echo "::warning::could not read the waiting entries — cross-check undetermined."
          fi

          # ---- UIL-046: did a sync APPLY actually run? An apply writes the undo point;
          # `executeUndo` consumes it (exec.ts:352-357 reads it, `delete_snapshot` at the end). So this
          # is the ONE discriminator between "an apply ran and the re-park key missed" (a real defect)
          # and "no apply has run, so retry_count 0 is correct" (not a bug). Every other path — the
          # retry action with nothing to promote, an identical re-import classified `noop` — writes
          # nothing for a still-waiting row BY DESIGN.
          echo
          echo "--- UIL-046: has a sync apply run since the last undo? ---"
          snapshots=$(count_of "last_sync_snapshot?select=id")
          echo "last_sync_snapshot rows: $snapshots"
          if [ "$snapshots" = "unknown" ]; then
            echo "::warning::could not read last_sync_snapshot — UIL-046 undetermined."
          elif [ "$snapshots" -eq 0 ]; then
            echo "VERDICT: no apply has run since the last undo, so retry_count 0 on the six waiting rows is CORRECT. UIL-046 is Not-a-bug — and nobody should be told she re-ran a sync or ignored a stop."
          else
            echo "::warning::an apply HAS run ($snapshots undo point(s)), so those six SHOULD have been re-parked and bumped. That makes UIL-046 a real defect: next question is why the \`\${dex_id} \${dex_variant_raw}\` key missed."
          fi

          # ---- UIL-048 blast radius: how many (catalog_card_id, binder_id) pairs hold MORE THAN ONE
          # shelved copy — i.e. phantom duplicates to clean up once the guard lands.
          #
          # PostgREST has no GROUP BY, so the grouping is done here. Pages by rows RECEIVED, not by the
          # page size requested, so a server max-rows below the page size cannot skip rows. Prints ONLY
          # the aggregate — the pairs themselves are card identity and are never echoed.
          echo
          echo "--- UIL-048: (catalog_card_id, binder_id) pairs with >1 shelved copy ---"
          offset=0
          : > shelved.txt
          while :; do
            case "$SERVICE_KEY" in
              eyJ*) page=$(curl -sS --retry 3 -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY" \
                      "$rest/copy?select=catalog_card_id,binder_id&role=eq.shelved&binder_id=not.is.null&order=id.asc&limit=1000&offset=$offset") ;;
              *)    page=$(curl -sS --retry 3 -H "apikey: $SERVICE_KEY" \
                      "$rest/copy?select=catalog_card_id,binder_id&role=eq.shelved&binder_id=not.is.null&order=id.asc&limit=1000&offset=$offset") ;;
            esac
            if ! printf '%s' "$page" | jq -e 'type == "array"' > /dev/null 2>&1; then
              echo "::warning::could not read shelved copies — UIL-048 blast radius undetermined."
              break
            fi
            n=$(printf '%s' "$page" | jq 'length')
            [ "$n" -gt 0 ] || break
            printf '%s' "$page" | jq -r '.[] | "\(.catalog_card_id)|\(.binder_id)"' >> shelved.txt
            offset=$((offset + n))
          done
          if [ -s shelved.txt ] || [ "$offset" -gt 0 ]; then
            total_shelved=$(wc -l < shelved.txt | tr -d ' ')
            dup_pairs=$(sort shelved.txt | uniq -c | awk '$1 > 1' | wc -l | tr -d ' ')
            dup_rows=$(sort shelved.txt | uniq -c | awk '$1 > 1 { s += $1 } END { print s + 0 }')
            echo "shelved copies scanned:            $total_shelved"
            echo "pairs holding >1 shelved copy:     $dup_pairs"
            echo "shelved copies in those pairs:     $dup_rows"
            if [ "$dup_pairs" -eq 0 ]; then
              echo "VERDICT: no phantom duplicates — nothing to clean up when the guard lands."
            else
              echo "VERDICT: $dup_pairs pair(s) to clean up, covering $dup_rows shelved copies ($((dup_rows - dup_pairs)) surplus)."
            fi
          else
            echo "no shelved copies with a binder — nothing to group."
          fi

          # ---- THE RECONCILER'S OWN INPUTS. lib/sync/pipeline.ts:106 loads the reconciler's `current`
          # with `presenceGroupRepo.list(db)` and `copyRepo.list(db)` — and `list()` is the UNPAGED
          # variant by design (lib/repo/base.ts:89-91 says outright: "correctness depends on
          # completeness, use listAll"). So if either table passes the cap, the reconciler concludes she
          # owns LESS than she does and the sync ADDS copies for cards she already has. That is not a
          # short list, it is wrong data — the "silently doubles her counts" outcome UIL-003 warned of.
          echo
          echo "--- the reconciler's inputs (pipeline.ts:106) ---"
          copies=$(count_of "copy?select=id")
          groups=$(count_of "presence_group?select=id")
          echo "copy:           $copies"
          echo "presence_group: $groups"
          over=0
          for pair in "copy:$copies" "presence_group:$groups"; do
            t=${pair%%:*}; n=${pair#*:}
            [ "$n" = "unknown" ] && continue
            if [ "$n" -ge 1000 ]; then
              echo "::error::LIVE DATA DEFECT — $t holds $n rows, at or past the 1000-row cap. loadCurrentGroups reconciles against a TRUNCATED view of her collection, so a sync can add copies for cards she already owns."
              over=1
            fi
          done
          if [ "$over" -eq 0 ]; then
            echo "VERDICT: both under the cap — loadCurrentGroups sees her whole collection today. Latent."
            [ "$copies" = "unknown" ] || echo "Headroom on copy: $((1000 - copies)) more physical cards before the reconciler starts lying."
          fi

      # ---- SCHEMA PROBE: before/after figures for a migration, without a new push per question.
      #
      # For each `table.column` in `probe_columns`: PRESENT or ABSENT (PostgREST 42703), and when
      # present: total rows, rows NOT NULL, the number of DISTINCT values (tables of <= 500 rows only,
      # and the values themselves are never printed), plus min/max for `*_at` timestamp columns. For
      # each entry in `count_tables` (optionally carrying a PostgREST filter, `copy?role=eq.shelved`):
      # the exact row count. COUNTS AND SHAPE ONLY — no row value reaches this public log.
      #
      # Why: a migration that adds a `default now()` column with triggers (UIL-052) or marker columns
      # (UIL-078) needs a falsifiable pair. Before Deploy applies it: column ABSENT, N rows. Right
      # after: PRESENT, N rows, N not-null, and ONE distinct timestamp (a single ALTER stamps every row
      # with the same now()). Then, once one of Karvi's writes fires the trigger: >1 distinct and a
      # newer max. Each figure is printed separately so the reader forms the verdict, not this script.
      - name: Schema probe (column presence + row counts)
        env:
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          PROBE_COLUMNS: ${{ inputs.probe_columns }}
          COUNT_TABLES: ${{ inputs.count_tables }}
          COMPARE_COLUMNS: ${{ inputs.compare_columns }}
        run: |
          set -euo pipefail
          rest="https://$PROJECT_REF.supabase.co/rest/v1"
          probe="${PROBE_COLUMNS:-collection.updated_at,line_slot.resolved_decision_kind,line_slot.resolved_decision_choice,placement_decision.line_id,placement_decision.line_slot_id}"
          tables="${COUNT_TABLES:-collection,copy,wishlist_item,placement_decision,line_slot}"
          compare="${COMPARE_COLUMNS:-collection.updated_at=created_at}"

          auth=(-H "apikey: $SERVICE_KEY")
          case "$SERVICE_KEY" in eyJ*) auth+=(-H "Authorization: Bearer $SERVICE_KEY") ;; esac

          count_of() {
            local headers total
            headers=$(curl -sS -D - -o /dev/null --retry 3 --retry-delay 5 "${auth[@]}" \
                        -H "Prefer: count=exact" -H "Range: 0-0" "$rest/$1")
            total=$(printf '%s' "$headers" | tr -d '\r' \
              | awk 'tolower($1) == "content-range:" { split($2, a, "/"); print a[2] }')
            printf '%s' "${total:-unknown}"
          }
          body_of() { curl -sS --retry 3 --retry-delay 5 "${auth[@]}" "$rest/$1"; }

          echo "=============== schema probe: columns ==============="
          IFS=',' read -r -a pairs <<< "$probe"
          for pair in "${pairs[@]}"; do
            pair="${pair// /}"; [ -n "$pair" ] || continue
            table="${pair%%.*}"; col="${pair#*.}"
            if [ "$table" = "$pair" ]; then
              echo "::warning::'$pair' is not table.column — skipped"
              continue
            fi
            out=$(body_of "$table?select=$col&limit=1")
            if printf '%s' "$out" | jq -e 'type == "array"' > /dev/null 2>&1; then
              total=$(count_of "$table?select=$col")
              nonnull=$(count_of "$table?select=$col&$col=not.is.null")
              echo "$table.$col: PRESENT   rows=$total   not-null=$nonnull"
              if [ "$total" != "unknown" ] && [ "$total" -le 500 ]; then
                vals=$(body_of "$table?select=$col&limit=500")
                distinct=$(printf '%s' "$vals" | jq --arg c "$col" '[.[][$c]] | unique | length')
                echo "  distinct values: $distinct"
                case "$col" in
                  *_at)
                    lo=$(printf '%s' "$vals" | jq -r --arg c "$col" '[.[][$c] | select(. != null)] | min // "n/a"')
                    hi=$(printf '%s' "$vals" | jq -r --arg c "$col" '[.[][$c] | select(. != null)] | max // "n/a"')
                    echo "  min: $lo   max: $hi" ;;
                esac
              fi
            else
              code=$(printf '%s' "$out" | jq -r '.code // "?"' 2>/dev/null || echo "?")
              if [ "$code" = "42703" ]; then
                echo "$table.$col: ABSENT    (42703: column does not exist)"
              else
                echo "$table.$col: UNREADABLE  code=$code $(printf '%s' "$out" | jq -rc '.message // .' 2>/dev/null | head -c 200)"
              fi
            fi
          done

          echo
          echo "=============== schema probe: row counts ==============="
          IFS=',' read -r -a specs <<< "$tables"
          for spec in "${specs[@]}"; do
            spec="${spec// /}"; [ -n "$spec" ] || continue
            # A spec may carry its own select= (needed for embedded-resource filters such as
            # `copy?select=id,binder!inner(type)&role=eq.shelved&binder.type=eq.general`).
            case "$spec" in
              *select=*) q="$spec" ;;
              *\?*)      q="$spec&select=*" ;;
              *)         q="$spec?select=*" ;;
            esac
            echo "$spec: $(count_of "$q")"
          done

          # ---- Column-vs-column: "zero rows where updated_at <> created_at" is the falsifier for a
          # backfill, and PostgREST cannot filter one column against another, so fetch both columns
          # (small tables only) and count the mismatches in jq. Values are never printed.
          echo
          echo "=============== schema probe: column comparisons ==============="
          IFS=',' read -r -a cmps <<< "$compare"
          for cmp in "${cmps[@]}"; do
            cmp="${cmp// /}"; [ -n "$cmp" ] || continue
            table="${cmp%%.*}"; rest_of="${cmp#*.}"; a="${rest_of%%=*}"; b="${rest_of#*=}"
            if [ "$table" = "$cmp" ] || [ "$a" = "$rest_of" ]; then
              echo "::warning::'$cmp' is not table.colA=colB — skipped"
              continue
            fi
            total=$(count_of "$table?select=$a")
            if [ "$total" = "unknown" ]; then
              echo "$table.$a vs $b: UNREADABLE (count failed — column or table absent?)"
              continue
            fi
            if [ "$total" -gt 500 ]; then
              echo "$table.$a vs $b: SKIPPED ($total rows > 500)"
              continue
            fi
            rows=$(body_of "$table?select=$a,$b&limit=500")
            if ! printf '%s' "$rows" | jq -e 'type == "array"' > /dev/null 2>&1; then
              echo "$table.$a vs $b: UNREADABLE  $(printf '%s' "$rows" | jq -rc '.message // .' 2>/dev/null | head -c 200)"
              continue
            fi
            differ=$(printf '%s' "$rows" | jq --arg a "$a" --arg b "$b" '[.[] | select(.[$a] != .[$b])] | length')
            either_null=$(printf '%s' "$rows" | jq --arg a "$a" --arg b "$b" '[.[] | select(.[$a] == null or .[$b] == null)] | length')
            echo "$table.$a vs $b: rows=$total   differ=$differ   either-null=$either_null"
          done

      # ---- UIL-053: "a card can be shelved without appearing in the collection; mechanism
      # unidentified" (Unrated). Collection membership is derived at read time, never stored
      # (lib/coll/remove.ts): a copy shows in a collection iff role = 'shelved', its binder_id is in
      # collection.current_binder_ids AND its catalog_card_id is in collection.target_catalog_card_ids.
      # So the DATA-SIDE form of the phenomenon is a shelved copy sitting in one of a collection's
      # binders whose card is NOT on that collection's target list ("an untracked physical card
      # occupying a real pocket", remove.ts:15). Counted per collection. Zero everywhere refutes that
      # form on her current data and points at the read path instead; non-zero says which collections
      # intake should look at. Two adjacent counts that would also explain "shelved but not shown":
      # shelved copies whose binder is listed by NO collection, and binders listed by MORE THAN ONE.
      #
      # Collections are numbered 1..N in created_at order. No id, name, binder or card id is printed.
      - name: "UIL-053: shelved copies outside their collection's target list"
        env:
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          rest="https://$PROJECT_REF.supabase.co/rest/v1"
          auth=(-H "apikey: $SERVICE_KEY")
          case "$SERVICE_KEY" in eyJ*) auth+=(-H "Authorization: Bearer $SERVICE_KEY") ;; esac
          body_of() { curl -sS --retry 3 --retry-delay 5 "${auth[@]}" "$rest/$1"; }

          cols=$(body_of "collection?select=mode,current_binder_ids,target_catalog_card_ids&order=created_at.asc")
          shelved=$(body_of "copy?select=binder_id,catalog_card_id&role=eq.shelved&limit=1000")
          for v in cols shelved; do
            if ! printf '%s' "${!v}" | jq -e 'type == "array"' > /dev/null 2>&1; then
              echo "::warning::UIL-053 read: could not fetch $v — $(printf '%s' "${!v}" | jq -rc '.message // .' 2>/dev/null | head -c 200). Undetermined."
              exit 0
            fi
          done

          ncols=$(printf '%s' "$cols" | jq 'length')
          nshelved=$(printf '%s' "$shelved" | jq 'length')
          echo "=============== UIL-053: shelved copies vs collection target lists ==============="
          echo "collections: $ncols   shelved copies: $nshelved"
          if [ "$nshelved" -ge 1000 ]; then
            echo "::warning::shelved copies hit the 1000-row read cap — the counts below are on a truncated set."
          fi

          printf '%s' "$cols" | jq -r --argjson shelved "$shelved" '
            to_entries[] | .key as $i | .value as $c
            | ($c.current_binder_ids // []) as $b
            | ($c.target_catalog_card_ids // []) as $t
            | [ $shelved[] | select(.binder_id != null and (.binder_id | IN($b[]))) ] as $in
            | [ $in[] | select(.catalog_card_id | IN($t[])) ] as $on
            | "collection #\($i + 1) mode=\($c.mode): binders=\($b | length) targets=\($t | length) shelved-in-binders=\($in | length) on-target=\($on | length) OFF-TARGET=\(($in | length) - ($on | length))"
          '

          off_total=$(printf '%s' "$cols" | jq --argjson shelved "$shelved" '
            [ .[] | (.current_binder_ids // []) as $b | (.target_catalog_card_ids // []) as $t
              | [ $shelved[] | select(.binder_id != null and (.binder_id | IN($b[]))) ]
              | map(select(.catalog_card_id | IN($t[]) | not)) | length ] | add // 0')
          null_binder=$(printf '%s' "$shelved" | jq '[ .[] | select(.binder_id == null) ] | length')
          orphan=$(printf '%s' "$shelved" | jq --argjson cols "$cols" '
            [ $cols[] | .current_binder_ids // [] | .[] ] as $all
            | [ .[] | select(.binder_id != null and (.binder_id | IN($all[]) | not)) ] | length')
          shared=$(printf '%s' "$cols" | jq '[ .[] | .current_binder_ids // [] | .[] ] | group_by(.) | map(select(length > 1)) | length')
          # When several collections list the SAME binder, a copy that is on collection B's list is
          # "off-target" for collection A by construction, so the per-collection figure overstates the
          # phenomenon. The union view below is the one that isolates it: for each shelved copy in a
          # collection-listed binder, how many collections (that list that binder) have its card on
          # their target list. 0 = an untracked physical card; >=2 = shown in more than one collection.
          union=$(printf '%s' "$shelved" | jq -c --argjson cols "$cols" '
            [ .[] | select(.binder_id != null) | . as $s
              | [ $cols[] | . as $c | select($s.binder_id | IN(($c.current_binder_ids // [])[])) ] as $listing
              | select(($listing | length) > 0)
              | [ $listing[] | . as $c | select($s.catalog_card_id | IN(($c.target_catalog_card_ids // [])[])) ] | length ]
            | { in_listed_binders: length,
                on_no_list: (map(select(. == 0)) | length),
                on_one_list: (map(select(. == 1)) | length),
                on_many_lists: (map(select(. >= 2)) | length) }')
          binders_shelved=$(printf '%s' "$shelved" | jq '[ .[].binder_id | select(. != null) ] | unique | length')
          binders_listed=$(printf '%s' "$cols" | jq '[ .[] | .current_binder_ids // [] | .[] ] | unique | length')
          binders_unlisted_used=$(printf '%s' "$shelved" | jq --argjson cols "$cols" '
            [ $cols[] | .current_binder_ids // [] | .[] ] as $all
            | [ .[].binder_id | select(. != null and (IN($all[]) | not)) ] | unique | length')
          echo
          echo "OFF-TARGET total (per-collection view, overstated when binders are shared):          $off_total"
          echo "shelved copies in a collection-listed binder:                                      $(printf '%s' "$union" | jq .in_listed_binders)"
          echo "  of which on NO listing collection's target list (untracked physical card):        $(printf '%s' "$union" | jq .on_no_list)"
          echo "  of which on exactly ONE listing collection's target list:                         $(printf '%s' "$union" | jq .on_one_list)"
          echo "  of which on TWO OR MORE listing collections' target lists:                        $(printf '%s' "$union" | jq .on_many_lists)"
          echo "shelved copies with NO binder_id:                                                  $null_binder"
          echo "shelved copies whose binder is listed by NO collection:                            $orphan"
          echo "distinct binders holding shelved copies / listed by a collection / used but unlisted: $binders_shelved / $binders_listed / $binders_unlisted_used"
          echo "binders listed by MORE THAN ONE collection:                                        $shared"
          echo
          echo "What this counts: copy rows with role = shelved, joined to collections by binder_id IN current_binder_ids, split by catalog_card_id IN target_catalog_card_ids. It does not count bulk or block copies, and it does not test the read path."

      # ---- PR #90's PREMISE. Its `assertReadComplete` guard assumes supabase-js's `count: "exact"`
      # reports the UNTRUNCATED total even when `data` was capped at max-rows. That is documented but was
      # never observed here: PGlite is real Postgres with no REST layer, so it has no cap and no
      # Content-Range to reproduce the pair. If `count` were itself capped, the guard would compare 1000
      # against 1000, never fire, and ship as protection that does nothing — the dead-guard shape this
      # project has already produced twice.
      #
      # `catalog_card` holds ~23.5k rows, so it is the natural probe. Tested BOTH ways: raw PostgREST
      # headers (what is actually on the wire) and through supabase-js itself (what #90 will really see).
      - name: "PR #90 premise: does count:exact survive max-rows truncation?"
        env:
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          echo "--- (a) raw PostgREST: Prefer: count=exact, NO Range header ---"
          case "$SERVICE_KEY" in
            eyJ*) hdrs=$(curl -sS -D - -o body.json --retry 3 -H "apikey: $SERVICE_KEY" \
                    -H "Authorization: Bearer $SERVICE_KEY" -H "Prefer: count=exact" \
                    "https://$PROJECT_REF.supabase.co/rest/v1/catalog_card?select=tcgdex_id") ;;
            *)    hdrs=$(curl -sS -D - -o body.json --retry 3 -H "apikey: $SERVICE_KEY" \
                    -H "Prefer: count=exact" \
                    "https://$PROJECT_REF.supabase.co/rest/v1/catalog_card?select=tcgdex_id") ;;
          esac
          cr=$(printf '%s' "$hdrs" | tr -d '\r' | awk 'tolower($1) == "content-range:" { print $2 }')
          returned=$(jq 'length' body.json)
          echo "content-range: ${cr:-<absent>}"
          echo "rows actually returned: $returned"
          total=${cr#*/}
          if [ "$returned" -lt "${total:-0}" ]; then
            echo "  => PostgREST DID cap the rows ($returned) while reporting the true total ($total)."
          else
            echo "  => no truncation observed here (returned $returned, total ${total:-?}) — the cap may be higher than the table."
          fi

      # First checkout in this job — every step above talks to PostgREST over curl and needs no repo.
      # supabase-js does: it needs .nvmrc, package.json and the lockfile.
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: "PR #90 premise, through supabase-js (the code path #90 relies on)"
        env:
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          cat > premise.mjs <<'JS'
          import { createClient } from "@supabase/supabase-js";
          const db = createClient(
            `https://${process.env.PROJECT_REF}.supabase.co`,
            process.env.SERVICE_KEY,
            { auth: { persistSession: false, autoRefreshToken: false } },
          );
          // EXACTLY #90's shape: count:"exact" WITHOUT head, so data and count arrive together.
          const { data, count, error } = await db
            .from("catalog_card")
            .select("tcgdex_id", { count: "exact" });
          console.log(JSON.stringify({
            rows: data ? data.length : null,
            count,
            error: error ? error.message : null,
          }));
          JS
          node premise.mjs > out.json
          cat out.json
          rows=$(jq -r '.rows' out.json); cnt=$(jq -r '.count' out.json); err=$(jq -r '.error' out.json)
          if [ "$err" != "null" ]; then
            echo "::error::supabase-js errored: $err — premise UNVERIFIED."
            exit 1
          fi
          if [ "$rows" = "null" ] || [ "$cnt" = "null" ]; then
            echo "::error::supabase-js returned rows=$rows count=$cnt — #90's guard cannot work on this pair. Premise FALSIFIED."
            exit 1
          fi
          echo "supabase-js: data.length=$rows  count=$cnt"
          if [ "$cnt" -gt "$rows" ]; then
            echo "VERDICT: PREMISE HOLDS — count ($cnt) exceeds the returned rows ($rows), so assertReadComplete can detect a truncated read. #90's guard will fire."
          else
            echo "::error::PREMISE FALSIFIED — count ($cnt) does NOT exceed the returned rows ($rows). #90 would compare equal values, never fire, and ship as protection that does nothing. Do not merge it on this assumption."
            exit 1
          fi

      # UIL-097 (2026-09-23): can the deploy PAT read Testing's AUTH CONFIG through the Management
      # API? If GET works, PATCHing the Magic Link template to a token_hash link is scriptable;
      # if 401/403, Karvi pastes it in the dashboard. READ-ONLY: this step never PATCHes.
      # Prints an allow-list of non-secret fields only (URLs, booleans, limits, the magic-link
      # template HTML). Anything whose name contains pass/secret/key/token is never printed.
      - name: "UIL-097: auth config readability via the Management API (read-only)"
        if: always()
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          echo "=============== UIL-097: GET /v1/projects/<ref>/config/auth ==============="
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "SUPABASE_ACCESS_TOKEN is NOT available to this job (not set on the 'testing' environment or repo). Verdict: dashboard path."
            exit 0
          fi
          out=$(curl -sS --retry 3 --retry-delay 5 -w $'\n%{http_code}' \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" || printf '\n000')
          code=${out##*$'\n'}
          body=${out%$'\n'*}
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "message: $(printf '%s' "$body" | jq -r '.message // .error // "(no message)"' 2>/dev/null | head -c 300)"
            echo "Verdict: the PAT cannot read auth config, so it cannot PATCH it either. Karvi edits the template in the dashboard."
            exit 0
          fi
          echo "Verdict: the PAT CAN read auth config (a PATCH to the same path is the scriptable route)."
          echo "--- non-secret fields ---"
          printf '%s' "$body" | jq -r '
            {
              site_url,
              uri_allow_list,
              external_email_enabled,
              mailer_autoconfirm,
              mailer_otp_exp,
              rate_limit_email_sent,
              smtp_host_set: ((.smtp_host // "") != ""),
              smtp_sender_name,
              smtp_admin_email,
              mailer_subjects_magic_link,
              magic_link_uses_TokenHash: ((.mailer_templates_magic_link_content // "") | test("TokenHash")),
              magic_link_uses_ConfirmationURL: ((.mailer_templates_magic_link_content // "") | test("ConfirmationURL")),
              field_count: (keys | length)
            }'
          echo "--- current magic link template (HTML, no secrets) ---"
          printf '%s' "$body" | jq -r '.mailer_templates_magic_link_content // "(empty: Supabase default template in use)"'
