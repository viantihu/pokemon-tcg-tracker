name: CI

# Quality gate for branch protection (docs/devops-strategy.md §8).
# If this is red, nothing merges.
on:
  pull_request:
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A migration that sorts behind one already on the base branch passes every
  # other gate and then breaks `supabase db push` on every future deploy. Catch
  # it at the PR (see scripts/check-migration-order.mjs).
  #
  # RUNS ON PUSH TOO, not just pull_request. This used to be gated on
  # `github.event_name == 'pull_request'`, which was defensible while every change
  # arrived through a PR — but branch protection is UNAVAILABLE on this repo's plan
  # (`GET /branches/develop/protection` returns 403 "Upgrade to GitHub Pro or make
  # this repository public"), so "nobody pushes a migration straight to develop" is a
  # convention rather than a control. With several sessions pushing concurrently, that
  # is not a safe thing to rely on. `Deploy → migrate` does still catch the
  # consequence — `supabase db push` refuses a mis-ordered migration and the schema
  # read-back then fails — but catching it here is one step earlier and free.
  migration-order:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # THE BASE DIFFERS BY EVENT, and getting this wrong makes the check pass
      # vacuously rather than fail loudly:
      #   pull_request -> `origin/<base_ref>`, the branch being merged into.
      #   push         -> `github.event.before`, the tip BEFORE this push. Comparing a
      #                   push against `origin/develop` would compare the branch to
      #                   ITSELF (the migration is already there by the time CI runs),
      #                   so the diff would be empty and the job would always pass.
      # `github.base_ref` is empty on a push, which is what selects the branch below.
      - name: Check migration order
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          zero="0000000000000000000000000000000000000000"
          if [ -n "${BASE_REF:-}" ]; then
            base="origin/$BASE_REF"
          elif [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "$zero" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base="$BEFORE"
          elif git rev-parse --verify --quiet HEAD^ > /dev/null; then
            # A first push to a new branch reports an all-zero `before`; fall back to the
            # parent commit so the check still has something to compare against.
            base="HEAD^"
            echo "::notice::no usable event base; comparing against HEAD^"
          else
            echo "::notice::no parent commit to compare against — nothing to check."
            exit 0
          fi
          echo "Comparing migrations against $base"
          node scripts/check-migration-order.mjs "$base"

      # `supabase db push` (Deploy -> migrate) LOADS supabase/config.toml before it connects
      # and refuses to start if any `content_path` in it does not resolve. Measured with CLI
      # 2.117.0 on 2026-09-23: with supabase/templates/magic_link.html hidden it exits with
      # LegacyDbConfigLoadError and never reaches the database, so moving or renaming that
      # file would pass every other gate and then break migrate on Testing and Production.
      # This runs the SAME loader, at the SAME version Deploy pins, against a dead local URL.
      # It passes only on a POSITIVE signal, "failed to connect to postgres" (config loaded,
      # connect refused as intended), so a new error shape fails loudly instead of passing
      # vacuously. Match MESSAGE TEXT, not error codes: the CLI prints plain text on the runner
      # but JSON ({"code":"LegacyDbConnectError",...}) when it detects an AI agent shell, and
      # both forms carry the same message.
      - name: Pin the Supabase CLI version from deploy.yml
        id: cli
        run: |
          set -euo pipefail
          v=$(awk '/uses: supabase\/setup-cli@/ { f = 1 } f && /version:/ { print $2; exit }' .github/workflows/deploy.yml)
          case "$v" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::deploy.yml's supabase/setup-cli version must be an exact x.y.z pin, got '$v'. A floating version lets a CLI release change how config.toml loads under migrate."; exit 1 ;;
          esac
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Deploy pins Supabase CLI $v"

      - uses: supabase/setup-cli@v3
        with:
          version: ${{ steps.cli.outputs.version }}

      - name: supabase/config.toml loads the way migrate will load it
        run: |
          set -uo pipefail
          # The dry run ALWAYS exits non-zero (the connect is refused by design), and Actions
          # runs `run:` under `bash -e`, which would end the step at this assignment before
          # the output is inspected. `|| true` keeps the captured output; the verdict is below.
          out=$(supabase db push --db-url "postgresql://ci:ci@127.0.0.1:1/ci" --dry-run 2>&1) || true
          printf '%s\n' "$out" | tail -5
          if printf '%s' "$out" | grep -q 'failed to connect to postgres'; then
            echo "config.toml loaded; the connect refusal is the expected end of this check."
            exit 0
          fi
          if printf '%s' "$out" | grep -q 'Invalid config for'; then
            echo "::error::supabase/config.toml does not load, so Deploy's migrate would fail before touching the database. Most likely a content_path points at a file that was moved or renamed (supabase/templates/magic_link.html, UIL-097). Fix the path or restore the file."
          else
            echo "::error::unexpected output: config loading could not be confirmed (no 'failed to connect to postgres'). If the CLI version changed, re-measure this check against it before relaxing the match."
          fi
          exit 1

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
