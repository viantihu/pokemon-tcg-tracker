name: Catalog Mirror (Testing)

# Populates the Testing catalog_card mirror from TCGdex, one set per request.
#
# Why this exists: lib/sync/catalog-lookup.ts resolves a Dex CSV row ONLY against
# the local mirror — there is no lazy fetch from TCGdex on a miss. Testing held
# just the handful of real cards in seed.sql, so a real CSV import sent almost
# every row to the unresolved queue and the sync could report "complete" having
# added nothing at all (UIL-004).
#
# Why one request per set instead of a single POST /api/catalog/sync: `syncAll`
# walks every set serially in one invocation (~23.5k cards), which will not finish
# inside a Vercel function's 300s limit. `?set=<id>` mirrors a single set well
# within it, and the loop lives here where there is no such ceiling. The upserts key
# on tcgdex_id, so re-running is idempotent and a partial run is safe to resume.
#
# Artwork hashing (`?pass=artwork`) is deliberately NOT run here. It downloads and
# hashes every card image, it is only needed for duplicate-artwork grouping, and CSV
# resolution keys on setCode-localId without it. Run it separately, later.
#
# Trigger: push to the ops/run-catalog-mirror branch (a workflow_dispatch button
# only appears once the file is on the default branch, and `main` deliberately lags
# `develop` until the production cutover). workflow_dispatch is declared too so the
# button starts working for free after that promotion.

on:
  push:
    branches: [ops/run-catalog-mirror]
  workflow_dispatch:

concurrency:
  group: catalog-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    environment: testing
    timeout-minutes: 60
    steps:
      # The service-role key is the bearer /api/catalog/sync checks, and it is the
      # reason this workflow had never run: nothing had ever set it on the `testing`
      # environment, so the job skipped itself every time — silently, which is how a
      # never-populated catalog went unnoticed until UAT (UIL-004). Deploy's
      # `acceptance` job skips on the same missing secret.
      #
      # So it now FAILS LOUDLY instead of skipping. It first tries to derive the key
      # from the Supabase PAT the deploy already uses, which saves pasting the same
      # value twice — but that needs a PAT with secret-read privileges, and a
      # narrowly-scoped one gets a 403 (the step logs which). The dependable path is
      # to set secrets.SUPABASE_SERVICE_ROLE_KEY on the `testing` environment; it
      # always wins when present.
      #
      # KEY FORMAT. Supabase is retiring the legacy JWT `anon` / `service_role` keys
      # in favour of `sb_publishable_…` / `sb_secret_…`, so the server-side key this
      # needs is a SECRET key on a current project and a `service_role` key on one
      # that still has legacy keys enabled. Both are handled below; the constraint
      # that actually matters is not the format but that the value MATCHES the app's
      # own SUPABASE_SERVICE_ROLE_KEY env var in Vercel, because /api/catalog/sync
      # compares the bearer against it as a plain string. Any other project key 401s.
      - name: Resolve the server-side API key
        id: creds
        env:
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          key="$SERVICE_KEY"
          origin="secrets.SUPABASE_SERVICE_ROLE_KEY"

          # GET the given Management API path, echoing the HTTP status and (on a
          # non-200) the API's message. Only ever prints key NAMES, never values.
          fetch() {
            local path="$1" out code
            out=$(curl -sS --retry 3 --retry-delay 5 -w $'\n%{http_code}' \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1$path" || printf '\n000')
            code=${out##*$'\n'}
            body=${out%$'\n'*}
            if [ "$code" != "200" ]; then
              echo "  GET $path -> HTTP $code: $(printf '%s' "$body" | jq -r '.message // .error // "(no message)"' 2>/dev/null)"
              body=""
            fi
          }

          if [ -z "$key" ] && [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$PROJECT_REF" ]; then
            origin="Supabase Management API"

            # Current key list. Select on the VALUE's prefix rather than on a `name` or
            # `type` enum: `sb_secret_` is documented and stable, whereas a secret key's
            # name is whatever it was created as, and only the legacy pair is reliably
            # named `service_role`. Prefer a secret key, fall back to legacy.
            fetch "/projects/$PROJECT_REF/api-keys?reveal=true"
            if [ -n "$body" ]; then
              echo "  keys returned: $(printf '%s' "$body" | jq -rc '[.[]? | {name, type}] // []' 2>/dev/null)"
              key=$(printf '%s' "$body" | jq -r '
                [.[]? | .api_key // empty | select(startswith("sb_secret_"))] | first // empty')
              if [ -z "$key" ]; then
                key=$(printf '%s' "$body" | jq -r '[.[]? | select(.name == "service_role") | .api_key] | first // empty')
              fi
            fi

            # Projects still on the legacy JWT pair expose it on its own endpoint.
            if [ -z "$key" ]; then
              fetch "/projects/$PROJECT_REF/api-keys/legacy"
              if [ -n "$body" ]; then
                echo "  legacy fields: $(printf '%s' "$body" | jq -rc 'if type == "array" then [.[]?.name] else keys end' 2>/dev/null)"
                key=$(printf '%s' "$body" | jq -r '
                  if type == "array"
                  then ([.[]? | select(.name == "service_role") | (.api_key // .apiKey)] | first)
                  else (.service_role // .service_role_key // .serviceRoleKey)
                  end // empty')
              fi
            fi
          fi

          if [ -z "$key" ]; then
            echo "::error::No server-side API key, so the mirror cannot run. Fix: in the Supabase dashboard for project $PROJECT_REF (Project Settings -> API Keys), copy the SECRET key (sb_secret_...) — or the legacy 'service_role' key if this project still has legacy keys enabled — into a GitHub ENVIRONMENT secret named SUPABASE_SERVICE_ROLE_KEY on the 'testing' environment. Whichever you copy must be the SAME value the app already has in Vercel as SUPABASE_SERVICE_ROLE_KEY, or /api/catalog/sync will 401 on the bearer check. A 403 above just means SUPABASE_ACCESS_TOKEN lacks the secret-read privilege, which is expected for a scoped PAT and is not a fault."
            exit 1
          fi

          # Mask before it can reach a log line, then hand it to later steps.
          echo "::add-mask::$key"
          echo "SERVICE_KEY=$key" >> "$GITHUB_ENV"
          case "$key" in
            sb_secret_*) fmt="secret key (sb_secret_...)" ;;
            sb_*) fmt="an sb_ key of an unrecognized subtype" ;;
            eyJ*) fmt="legacy JWT key (service_role)" ;;
            *) fmt="unrecognized format" ;;
          esac
          echo "Key format: $fmt"
          # Whether the key is a JWT decides how the Supabase REST gateway must be
          # addressed in the verify step: new-format keys are NOT JWTs and are rejected
          # ("Invalid JWT") if sent as a Bearer token, so they go on `apikey` alone.
          case "$key" in
            eyJ*) echo "KEY_IS_JWT=1" >> "$GITHUB_ENV" ;;
            *) echo "KEY_IS_JWT=0" >> "$GITHUB_ENV" ;;
          esac
          echo "Using the server-side key from: $origin"

      - name: Mirror every set
        env:
          APP_URL: ${{ vars.APP_URL }}
          # Public community catalog, no key required.
          TCGDEX_BASE_URL: https://api.tcgdex.net/v2
        run: |
          set -euo pipefail
          base="${APP_URL%/}"

          # Brief set list: GET /v2/en/sets (see lib/catalog/tcgdex.ts).
          curl -sS --retry 3 --retry-delay 5 "$TCGDEX_BASE_URL/en/sets" -o sets.json
          jq -r '.[].id' sets.json > set-ids.txt
          total=$(wc -l < set-ids.txt | tr -d ' ')
          echo "Mirroring $total sets into Testing."

          ok=0
          failed=0
          : > failures.txt

          while read -r set_id; do
            [ -n "$set_id" ] || continue
            # --get-style POST with no body; the route reads the set from the query.
            #
            # `Authorization: Bearer` is correct here even for a new-format secret key,
            # and must NOT be "fixed" to an apikey header: this request goes to OUR
            # Next.js route, which does a plain string compare against its own
            # SUPABASE_SERVICE_ROLE_KEY env var (app/api/catalog/sync/route.ts). It never
            # reaches Supabase's gateway, so nothing tries to parse it as a JWT. The
            # apikey-only rule applies to the Supabase REST call in the verify step.
            response=$(curl -sS -X POST \
              -H "Authorization: Bearer $SERVICE_KEY" \
              -w $'\n%{http_code}' \
              --max-time 300 \
              "$base/api/catalog/sync?set=$set_id" || printf '\n000')
            code=${response##*$'\n'}
            body=${response%$'\n'*}
            if [ "$code" = "200" ]; then
              ok=$((ok + 1))
              printf '  %-14s ok  %s\n' "$set_id" "$(printf '%s' "$body" | jq -c '.result' 2>/dev/null || echo '')"
            else
              failed=$((failed + 1))
              printf '  %-14s FAIL (HTTP %s) %s\n' "$set_id" "$code" "$body"
              echo "$set_id HTTP=$code $body" >> failures.txt
              # A 401 means the bearer does not match the app's own key, so every
              # remaining set would fail the same way. Stop rather than hammer 200+
              # requests at a wall.
              if [ "$code" = "401" ]; then
                echo "::error::401 from /api/catalog/sync — the bearer does not match the SUPABASE_SERVICE_ROLE_KEY configured in Vercel for this environment."
                exit 1
              fi
            fi
            # Be a good citizen to a free community API.
            sleep 1
          done < set-ids.txt

          echo "Mirrored $ok/$total sets; $failed failed."
          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed set(s) failed to mirror — see failures.txt in the job log above."
            exit 1
          fi

      # The point of the run is rows in the table, so verify that directly instead of
      # inferring it from the app still being up: ask PostgREST for an exact
      # catalog_card count via Content-Range.
      #
      # HEADERS. This one DOES go to Supabase's gateway, so the key format matters. A
      # new-format key (`sb_secret_…`) is not a JWT and belongs on `apikey` ALONE — sent
      # as a Bearer token the platform tries to parse it and rejects with "Invalid JWT".
      # A legacy `service_role` JWT still needs the Bearer header to be read as that
      # role rather than as anon. So the Bearer is added only for a JWT key.
      - name: Verify the mirror is populated
        env:
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          url="https://$PROJECT_REF.supabase.co/rest/v1/catalog_card?select=tcgdex_id"
          # Two explicit invocations rather than a conditionally-expanded array: an empty
          # array under `set -u` is a portability trap not worth the cleverness here.
          if [ "${KEY_IS_JWT:-0}" = "1" ]; then
            headers=$(curl -sS -D - -o /dev/null \
              -H "apikey: $SERVICE_KEY" \
              -H "Authorization: Bearer $SERVICE_KEY" \
              -H "Prefer: count=exact" -H "Range: 0-0" "$url")
          else
            headers=$(curl -sS -D - -o /dev/null \
              -H "apikey: $SERVICE_KEY" \
              -H "Prefer: count=exact" -H "Range: 0-0" "$url")
          fi
          # content-range looks like "0-0/23500"; the total is after the slash.
          rows=$(printf '%s' "$headers" | tr -d '\r' | awk 'tolower($1) == "content-range:" { split($2, a, "/"); print a[2] }')
          echo "catalog_card rows: ${rows:-unknown}"
          if [ -z "${rows:-}" ] || [ "$rows" = "*" ]; then
            echo "::error::could not read a row count for catalog_card. If the response mentioned \"Invalid JWT\", the key was sent as a Bearer token but is not a JWT."
            exit 1
          fi
          # seed.sql ships 3 cards. Anything in that neighbourhood means the mirror
          # did not actually land, which is the exact state UIL-004 describes.
          if [ "$rows" -lt 1000 ]; then
            echo "::error::catalog_card holds only $rows rows — the mirror did not populate."
            exit 1
          fi
          echo "Mirror populated."
