name: Catalog Mirror (Testing)

# Populates the Testing catalog_card mirror from TCGdex, one set per request.
#
# Why this exists: lib/sync/catalog-lookup.ts resolves a Dex CSV row ONLY against
# the local mirror — there is no lazy fetch from TCGdex on a miss. Testing held
# just the handful of real cards in seed.sql, so a real CSV import sent almost
# every row to the unresolved queue and the sync could report "complete" having
# added nothing at all (UIL-004).
#
# Why one request per set instead of a single POST /api/catalog/sync: `syncAll`
# walks every set serially in one invocation (~23.5k cards), which will not finish
# inside a Vercel function's 300s limit. `?set=<id>` mirrors a single set well
# within it, and the loop lives here where there is no such ceiling. The upserts key
# on tcgdex_id, so re-running is idempotent and a partial run is safe to resume.
#
# RUNS RESUME. The job first reads how many cards catalog_card already holds per set
# and requests only the sets that are missing or short of their TCGdex card count.
# Every failure this workflow has had is TCGdex throttling us (a 503 surfaced as our
# 502), and the failure count grew with each full 218-set run — so recovering a
# handful of sets by re-requesting all 218 is what was causing the next failure. See
# the long comment on the `Mirror every set` step. `force_all: true` on a manual run
# overrides this and re-requests everything, for when the mirror itself changed and
# every row genuinely needs rewriting.
#
# Artwork hashing (`?pass=artwork`) is deliberately NOT run here. It downloads and
# hashes every card image, it is only needed for duplicate-artwork grouping, and CSV
# resolution keys on setCode-localId without it. Run it separately, later.
#
# HOW TO RUN IT. Prefer the API, which works TODAY and takes inputs:
#
#   gh workflow run catalog-mirror.yml --ref develop -f force_all=true
#
# Verified 2026-09-14 (run 34909186338): 218/218 sets, zero failures. An earlier note here claimed
# dispatch could not reach this workflow because the file is not on the default branch — that is
# true only of the **UI button**, which GitHub renders only for workflows on the default branch, and
# `main` deliberately lags `develop` until the production cutover. The `workflow_dispatch` **API**
# has no such restriction, so `gh workflow run --ref <branch>` reaches it regardless. The button
# appears for free after the cutover.
#
# Pushing to `ops/run-catalog-mirror` also triggers it and is retained, but prefer dispatch: a push
# carries NO inputs, so `force_all` is unset and the run resumes instead of re-mirroring — and a
# push to that branch also consumes a Vercel build, which dispatch does not.
#
# `force_all=true` is REQUIRED after a migration adds a column to `catalog_card`. Without it the
# resume check sees every set already at its full card count, prints "Every set is already
# mirrored… Nothing to do" and exits 0 — a green run that populates nothing, which is exactly how
# UIL-004 stayed hidden. Verify a column landed by counting non-NULLs, never by the run being green.

on:
  push:
    branches: [ops/run-catalog-mirror]
  workflow_dispatch:
    inputs:
      force_all:
        description: "Re-request every set, even ones already fully mirrored"
        type: boolean
        default: false
      locale:
        description: "Which TCGdex catalog to mirror. One locale per run; a ja run touches only ja rows."
        type: choice
        options: [en, ja]
        default: en

concurrency:
  group: catalog-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    environment: testing
    timeout-minutes: 60
    steps:
      # The service-role key is the bearer /api/catalog/sync checks, and it is the
      # reason this workflow had never run: nothing had ever set it on the `testing`
      # environment, so the job skipped itself every time — silently, which is how a
      # never-populated catalog went unnoticed until UAT (UIL-004). Deploy's
      # `acceptance` job skips on the same missing secret.
      #
      # So it now FAILS LOUDLY instead of skipping. It first tries to derive the key
      # from the Supabase PAT the deploy already uses, which saves pasting the same
      # value twice — but that needs a PAT with secret-read privileges, and a
      # narrowly-scoped one gets a 403 (the step logs which). The dependable path is
      # to set secrets.SUPABASE_SERVICE_ROLE_KEY on the `testing` environment; it
      # always wins when present.
      #
      # KEY FORMAT. Supabase is retiring the legacy JWT `anon` / `service_role` keys
      # in favour of `sb_publishable_…` / `sb_secret_…`, so the server-side key this
      # needs is a SECRET key on a current project and a `service_role` key on one
      # that still has legacy keys enabled. Both are handled below; the constraint
      # that actually matters is not the format but that the value MATCHES the app's
      # own SUPABASE_SERVICE_ROLE_KEY env var in Vercel, because /api/catalog/sync
      # compares the bearer against it as a plain string. Any other project key 401s.
      - name: Resolve the server-side API key
        id: creds
        env:
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          key="$SERVICE_KEY"
          origin="secrets.SUPABASE_SERVICE_ROLE_KEY"

          # GET the given Management API path, echoing the HTTP status and (on a
          # non-200) the API's message. Only ever prints key NAMES, never values.
          fetch() {
            local path="$1" out code
            out=$(curl -sS --retry 3 --retry-delay 5 -w $'\n%{http_code}' \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1$path" || printf '\n000')
            code=${out##*$'\n'}
            body=${out%$'\n'*}
            if [ "$code" != "200" ]; then
              echo "  GET $path -> HTTP $code: $(printf '%s' "$body" | jq -r '.message // .error // "(no message)"' 2>/dev/null)"
              body=""
            fi
          }

          if [ -z "$key" ] && [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$PROJECT_REF" ]; then
            origin="Supabase Management API"

            # Current key list. Select on the VALUE's prefix rather than on a `name` or
            # `type` enum: `sb_secret_` is documented and stable, whereas a secret key's
            # name is whatever it was created as, and only the legacy pair is reliably
            # named `service_role`. Prefer a secret key, fall back to legacy.
            fetch "/projects/$PROJECT_REF/api-keys?reveal=true"
            if [ -n "$body" ]; then
              echo "  keys returned: $(printf '%s' "$body" | jq -rc '[.[]? | {name, type}] // []' 2>/dev/null)"
              key=$(printf '%s' "$body" | jq -r '
                [.[]? | .api_key // empty | select(startswith("sb_secret_"))] | first // empty')
              if [ -z "$key" ]; then
                key=$(printf '%s' "$body" | jq -r '[.[]? | select(.name == "service_role") | .api_key] | first // empty')
              fi
            fi

            # Projects still on the legacy JWT pair expose it on its own endpoint.
            if [ -z "$key" ]; then
              fetch "/projects/$PROJECT_REF/api-keys/legacy"
              if [ -n "$body" ]; then
                echo "  legacy fields: $(printf '%s' "$body" | jq -rc 'if type == "array" then [.[]?.name] else keys end' 2>/dev/null)"
                key=$(printf '%s' "$body" | jq -r '
                  if type == "array"
                  then ([.[]? | select(.name == "service_role") | (.api_key // .apiKey)] | first)
                  else (.service_role // .service_role_key // .serviceRoleKey)
                  end // empty')
              fi
            fi
          fi

          if [ -z "$key" ]; then
            echo "::error::No server-side API key, so the mirror cannot run. Fix: in the Supabase dashboard for project $PROJECT_REF (Project Settings -> API Keys), copy the SECRET key (sb_secret_...) — or the legacy 'service_role' key if this project still has legacy keys enabled — into a GitHub ENVIRONMENT secret named SUPABASE_SERVICE_ROLE_KEY on the 'testing' environment. Whichever you copy must be the SAME value the app already has in Vercel as SUPABASE_SERVICE_ROLE_KEY, or /api/catalog/sync will 401 on the bearer check. A 403 above just means SUPABASE_ACCESS_TOKEN lacks the secret-read privilege, which is expected for a scoped PAT and is not a fault."
            exit 1
          fi

          # Mask before it can reach a log line, then hand it to later steps.
          echo "::add-mask::$key"
          echo "SERVICE_KEY=$key" >> "$GITHUB_ENV"
          case "$key" in
            sb_secret_*) fmt="secret key (sb_secret_...)" ;;
            sb_*) fmt="an sb_ key of an unrecognized subtype" ;;
            eyJ*) fmt="legacy JWT key (service_role)" ;;
            *) fmt="unrecognized format" ;;
          esac
          echo "Key format: $fmt"
          # Whether the key is a JWT decides how the Supabase REST gateway must be
          # addressed in the verify step: new-format keys are NOT JWTs and are rejected
          # ("Invalid JWT") if sent as a Bearer token, so they go on `apikey` alone.
          case "$key" in
            eyJ*) echo "KEY_IS_JWT=1" >> "$GITHUB_ENV" ;;
            *) echo "KEY_IS_JWT=0" >> "$GITHUB_ENV" ;;
          esac
          echo "Using the server-side key from: $origin"

      - name: Mirror every set
        env:
          APP_URL: ${{ vars.APP_URL }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          FORCE_ALL: ${{ inputs.force_all }}
          # A push to ops/run-catalog-mirror carries no inputs, so it mirrors en, as it always has.
          LOCALE: ${{ inputs.locale || 'en' }}
          # Public community catalog, no key required.
          TCGDEX_BASE_URL: https://api.tcgdex.net/v2
        run: |
          set -euo pipefail
          base="${APP_URL%/}"

          # ONE LOCALE PER RUN (UIL-047, migration 0016). Rows for a non-en locale are stored
          # namespaced — tcgdex_id `ja:sv11w-002`, set_id `ja:sv11w` — and carry `locale`, so
          # en rows stay byte-identical to TCGdex and the four Neo set ids the two catalogs
          # share never collide. TCGdex itself knows only the bare ids, so this job speaks bare
          # ids to TCGdex and to /api/catalog/sync, and strips the namespace when it reads back
          # what is stored. The `choice` input already restricts the value; this guard is for
          # the push trigger and for anyone editing the default.
          case "$LOCALE" in
            en|ja) ;;
            *) echo "::error::LOCALE must be en or ja, got '$LOCALE'"; exit 1 ;;
          esac
          # Stored set ids carry this prefix for every locale but en.
          if [ "$LOCALE" = "en" ]; then ns=""; else ns="$LOCALE:"; fi

          # Brief set list: GET /v2/<locale>/sets (see lib/catalog/tcgdex.ts). `cardCount.total`
          # is how many cards TCGdex holds for the set, which is the target the resume
          # check below compares against.
          curl -sS --retry 3 --retry-delay 5 "$TCGDEX_BASE_URL/$LOCALE/sets" -o sets.json
          jq -r '.[].id' sets.json > set-ids.txt
          total=$(wc -l < set-ids.txt | tr -d ' ')

          # RESUME, RATHER THAN RE-REQUEST ALL 218 SETS.
          #
          # Every failure this workflow has ever had is an upstream TCGdex 503 (surfaced as
          # our 502) and the count grew run over run — 2, then 1, then 13 — which is
          # throttling caused by the runs themselves. Run 34787934423 ended at 205/218 with
          # 13 sets down, among them sv10, swsh4 and me01: current sets, not obscure ones,
          # so a Dex export would park real cards in the unresolved queue (UIL-004).
          #
          # Re-running the whole mirror to recover 13 sets sends 218 requests to the API that
          # is already throttling us, which is what produced the growth. The upserts are
          # idempotent, so instead ask the mirror what it already holds and request only the
          # gap. A resume run is then a handful of requests rather than 218, and the backoff
          # below stops being load-bearing for the common case.
          #
          # Counts, not presence: a set that half-landed has rows but is still incomplete,
          # and a presence check would call it done and leave the missing cards unresolvable
          # forever. `stored < cardCount.total` catches both an absent set and a partial one.
          #
          # Paging advances by rows RECEIVED, not by the page size requested. PostgREST caps
          # a response at its own `max-rows` regardless of `limit`, so advancing by the
          # request size skips rows whenever the cap is smaller — the same bug lib/repo's
          # `listAll` was fixed for in #39.
          # Only rows the mirror itself wrote for THIS locale count towards "complete":
          # `source=eq.tcgdex` keeps a user stand-in (0015) from making its set look done one
          # card early, and `locale=eq.$LOCALE` keeps a ja run from being satisfied by en rows
          # (or the reverse) on the Neo sets both catalogs name the same. Before 0015/0016 apply,
          # either filter is a 42703 and this returns 1 — the fail-closed branch below — which
          # is why the workflow change ships in the same PR as the migration, never ahead of it.
          read_stored_counts() {
            local rest="https://$PROJECT_REF.supabase.co/rest/v1/catalog_card"
            local offset=0 page n
            : > stored-set-ids.txt
            while :; do
              if [ "${KEY_IS_JWT:-0}" = "1" ]; then
                page=$(curl -sS --retry 3 --retry-delay 5 \
                  -H "apikey: $SERVICE_KEY" -H "Authorization: Bearer $SERVICE_KEY" \
                  "$rest?select=set_id&source=eq.tcgdex&locale=eq.$LOCALE&order=set_id.asc&limit=1000&offset=$offset")
              else
                page=$(curl -sS --retry 3 --retry-delay 5 \
                  -H "apikey: $SERVICE_KEY" \
                  "$rest?select=set_id&source=eq.tcgdex&locale=eq.$LOCALE&order=set_id.asc&limit=1000&offset=$offset")
              fi
              # A PostgREST error is an object, not an array; `length` on it would be a key
              # count and the loop would misread it as data.
              if ! printf '%s' "$page" | jq -e 'type == "array"' > /dev/null 2>&1; then
                echo "  could not read catalog_card: $(printf '%s' "$page" | jq -rc '.message // .' 2>/dev/null | head -c 200)"
                return 1
              fi
              n=$(printf '%s' "$page" | jq 'length')
              [ "$n" -gt 0 ] || break
              printf '%s' "$page" | jq -r '.[].set_id // empty' >> stored-set-ids.txt
              offset=$((offset + n))
            done
            # "<set_id> <count>" per line, with the locale namespace stripped so the ids match
            # TCGdex's bare ids in expected-counts.txt (`ja:sv11w` -> `sv11w`; en has no prefix).
            sed "s/^$ns//" stored-set-ids.txt | sort | uniq -c | awk '{ print $2, $1 }' > stored-counts.txt
            return 0
          }

          # "<set_id> <cardCount.total>" per line. Written once here because both the resume
          # check below and the upstream-shortfall report after the loop read it.
          jq -r '.[] | "\(.id) \(.cardCount.total // 0)"' sets.json > expected-counts.txt

          : > remaining.txt
          : > upstream-short.txt
          if [ "${FORCE_ALL:-false}" = "true" ]; then
            echo "force_all requested: mirroring all $total sets regardless of what is stored."
            cp set-ids.txt remaining.txt
          elif read_stored_counts; then
            stored_rows=$(wc -l < stored-set-ids.txt | tr -d ' ')
            echo "catalog_card currently holds $stored_rows $LOCALE rows across $(wc -l < stored-counts.txt | tr -d ' ') sets."
            skipped=0
            while read -r set_id expected; do
              [ -n "$set_id" ] || continue
              have=$(awk -v s="$set_id" '$1 == s { print $2 }' stored-counts.txt)
              have=${have:-0}
              if [ "$have" -ge "$expected" ] && [ "$expected" -gt 0 ]; then
                skipped=$((skipped + 1))
              else
                printf '  %-14s needs mirroring (have %s of %s)\n' "$set_id" "$have" "$expected"
                echo "$set_id" >> remaining.txt
              fi
            done < expected-counts.txt
            echo "Complete already: $skipped set(s). To mirror: $(wc -l < remaining.txt | tr -d ' ')."
          else
            # Do NOT fall back to a presence-free full run — not quietly, and (since 2026-09-19)
            # not at all. The whole reason UIL-004 went unnoticed is a step that degraded
            # silently, and the previous shape here (a `::warning::` then a full run) still
            # produced a GREEN job whose log had to be read to learn the read had failed
            # (docs/root-cause-analysis.md RC-6b). "Could not determine what is stored" and
            # "nothing is stored" are different states; only the operator can collapse them,
            # by re-dispatching with force_all=true, which takes the full-run path above.
            echo "::error::could not read the current catalog_card contents, so this run cannot tell which of the $total sets are already mirrored. Refusing to guess. If a full re-mirror is what you want, re-dispatch with force_all=true (expect TCGdex throttling); otherwise fix the read (the step above prints the failing request) and re-run."
            exit 1
          fi

          if [ ! -s remaining.txt ]; then
            echo "Every $LOCALE set is already mirrored to its full TCGdex card count. Nothing to do."
            exit 0
          fi

          ok=0
          attempting=$(wc -l < remaining.txt | tr -d ' ')
          echo "Mirroring $attempting of $total $LOCALE sets into Testing."

          # WHY BACKOFF AND NOT A FIXED PAUSE. Across the first three full runs every failure was an
          # upstream TCGdex 503 surfaced as our 502 — and the count GREW run over run (2, then 1, then
          # 13), which is throttling, not bad data. The failing sets differed each time and each one
          # succeeded on some other run, so the fix is to wait long enough for the upstream limit to
          # relax rather than to re-run the whole mirror and add load. A 5s pause is far too short for
          # that; these waits are minutes, and the sweep below spaces the survivors out further.
          attempt_set() {
            local set_id="$1"
            response=$(curl -sS -X POST \
              -H "Authorization: Bearer $SERVICE_KEY" \
              -w $'\n%{http_code}' \
              --max-time 300 \
              "$base/api/catalog/sync?set=$set_id&locale=$LOCALE" || printf '\n000')
            code=${response##*$'\n'}
            body=${response%$'\n'*}
          }

          # `attempt_set` sends `Authorization: Bearer`, which is correct even for a new-format secret
          # key and must NOT be "fixed" to an apikey header: that request goes to OUR Next.js route,
          # which does a plain string compare against its own SUPABASE_SERVICE_ROLE_KEY env var
          # (app/api/catalog/sync/route.ts). It never reaches Supabase's gateway, so nothing tries to
          # parse it as a JWT. The apikey-only rule applies to the Supabase REST call in the verify step.
          #
          # A 401 means the bearer does not match the app's own key, so every remaining set would fail
          # identically. Abort rather than hammer 200+ requests at a wall, and never retry it.
          abort_on_401() {
            if [ "$code" = "401" ]; then
              printf '  %-14s FAIL (HTTP 401) %s\n' "$1" "$body"
              echo "::error::401 from /api/catalog/sync — the bearer does not match the SUPABASE_SERVICE_ROLE_KEY configured in Vercel for this environment."
              exit 1
            fi
          }

          # Pass 1: straight through, one request per set. Anything that fails is left in the sweep
          # list rather than retried on the spot — pausing mid-pass just extends the window in which
          # we are being throttled, whereas by the end of the pass minutes have already elapsed.
          pass=1
          while [ -s remaining.txt ] && [ "$pass" -le 3 ]; do
            if [ "$pass" -gt 1 ]; then
              # 2 min, then 8 — long enough for an upstream rate limit to reset, and bounded so the
            # whole job still lands well inside `timeout-minutes` (pass 1 alone runs ~6 min).
              wait=$((120 * 4 ** (pass - 2)))
              echo "--- pass $pass: $(wc -l < remaining.txt | tr -d ' ') set(s) left, waiting ${wait}s for TCGdex to relax ---"
              sleep "$wait"
            fi
            : > still-failing.txt
            while read -r set_id; do
              [ -n "$set_id" ] || continue
              attempt_set "$set_id"
              abort_on_401 "$set_id"
              if [ "$code" = "200" ]; then
                ok=$((ok + 1))
                printf '  %-14s ok  %s\n' "$set_id" "$(printf '%s' "$body" | jq -c '.result' 2>/dev/null || echo '')"
                # A 200 that fetched fewer cards than the brief set list advertised is TCGdex
                # disagreeing with itself, not a mirror failure — see the note below.
                fetched=$(printf '%s' "$body" | jq -r '.result.fetched // empty' 2>/dev/null || echo '')
                expected=$(awk -v s="$set_id" '$1 == s { print $2 }' expected-counts.txt)
                if [ -n "$fetched" ] && [ -n "${expected:-}" ] && [ "$fetched" -lt "$expected" ]; then
                  printf '%s %s %s\n' "$set_id" "$fetched" "$expected" >> upstream-short.txt
                fi
              else
                printf '  %-14s FAIL (HTTP %s) %s\n' "$set_id" "$code" "$body"
                echo "$set_id" >> still-failing.txt
              fi
              # Be a good citizen to a free community API.
              sleep 1
            done < remaining.txt
            mv still-failing.txt remaining.txt
            pass=$((pass + 1))
          done

          failed=$(wc -l < remaining.txt | tr -d ' ')
          # Report against what this run set out to do, not against all 218 — a resume run
          # that fixes 13 of 13 sets is 13/13, and calling it 13/218 reads like a disaster.
          echo "Mirrored $ok/$attempting of the sets this run needed; $failed still failing."

          # TCGDEX DISAGREES WITH ITSELF ON SIX SETS, AND THAT IS NOT A GAP.
          #
          # The resume check targets `cardCount.total` from the brief set list, because that is
          # the only card count available without fetching the set. For a handful of sets the
          # DETAIL endpoint then returns fewer cards than the brief list advertised — run
          # 34795733862 measured `wp` 0/7, `jumbo` 0/160, `sp` 0/10, `rc` 0/25 (all `fetched: 0`),
          # `tk-sm-l` 18/30 and `mfb` 34/48. Promo, sample and jumbo pseudo-sets. Nothing is
          # missing that TCGdex is willing to serve, and the row count did not move: 23548
          # before, 23548 after.
          #
          # Those sets can therefore never satisfy `stored >= total`, so every future run
          # re-requests them. Six requests is cheap and it errs in the safe direction — the check
          # never SKIPS a set that needs mirroring — so this reports the discrepancy rather than
          # suppressing it. Suppressing it would need an allow-list that a genuinely truncated set
          # could later hide behind, which is the trade this workflow keeps refusing to make.
          if [ -s upstream-short.txt ]; then
            echo "TCGdex served fewer cards than its set list advertises for $(wc -l < upstream-short.txt | tr -d ' ') set(s):"
            while read -r s f e; do
              printf '  %-14s got %s of the %s claimed\n' "$s" "$f" "$e"
            done < upstream-short.txt
            echo "That is upstream data, not a mirror failure — these sets are as complete as TCGdex allows, and they will be re-requested on every run for that reason."
          fi

          if [ "$failed" -gt 0 ]; then
            echo "Sets that never succeeded:"
            sed 's/^/  /' remaining.txt
            echo "::error::$failed set(s) failed to mirror after 3 passes with backoff. Upserts are idempotent and this workflow now resumes — re-running requests only the sets still missing, not all $total — so a retry is cheap and safe. If these are TCGdex 503s, still wait a while rather than retrying immediately."
            exit 1
          fi

      # The point of the run is rows in the table, so verify that directly instead of
      # inferring it from the app still being up: ask PostgREST for an exact
      # catalog_card count via Content-Range.
      #
      # HEADERS. This one DOES go to Supabase's gateway, so the key format matters. A
      # new-format key (`sb_secret_…`) is not a JWT and belongs on `apikey` ALONE — sent
      # as a Bearer token the platform tries to parse it and rejects with "Invalid JWT".
      # A legacy `service_role` JWT still needs the Bearer header to be read as that
      # role rather than as anon. So the Bearer is added only for a JWT key.
      #
      # `always()`: a partial mirror is exactly when the row count is most worth knowing.
      # The first three runs each failed on a set or two, which skipped this step, so
      # nobody ever learned how many rows had actually landed — the one number the whole
      # job exists to move. It now reports even on a failed run (and still exits non-zero
      # itself if the catalog looks unpopulated), so a red run is diagnosable rather than
      # silent. Guarded on the key having resolved, since without it there is nothing to
      # query with.
      - name: Verify the mirror is populated
        if: always() && env.SERVICE_KEY != ''
        env:
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          url="https://$PROJECT_REF.supabase.co/rest/v1/catalog_card?select=tcgdex_id"
          # Two explicit invocations rather than a conditionally-expanded array: an empty
          # array under `set -u` is a portability trap not worth the cleverness here.
          if [ "${KEY_IS_JWT:-0}" = "1" ]; then
            headers=$(curl -sS -D - -o /dev/null \
              -H "apikey: $SERVICE_KEY" \
              -H "Authorization: Bearer $SERVICE_KEY" \
              -H "Prefer: count=exact" -H "Range: 0-0" "$url")
          else
            headers=$(curl -sS -D - -o /dev/null \
              -H "apikey: $SERVICE_KEY" \
              -H "Prefer: count=exact" -H "Range: 0-0" "$url")
          fi
          # content-range looks like "0-0/23500"; the total is after the slash.
          rows=$(printf '%s' "$headers" | tr -d '\r' | awk 'tolower($1) == "content-range:" { split($2, a, "/"); print a[2] }')
          echo "catalog_card rows: ${rows:-unknown}"
          if [ -z "${rows:-}" ] || [ "$rows" = "*" ]; then
            echo "::error::could not read a row count for catalog_card. If the response mentioned \"Invalid JWT\", the key was sent as a Bearer token but is not a JWT."
            exit 1
          fi
          # seed.sql ships 3 cards. Anything in that neighbourhood means the mirror
          # did not actually land, which is the exact state UIL-004 describes.
          if [ "$rows" -lt 1000 ]; then
            echo "::error::catalog_card holds only $rows rows — the mirror did not populate."
            exit 1
          fi
          echo "Mirror populated."
