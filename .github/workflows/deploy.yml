name: Deploy

# Applies DB migrations to the matching environment, then smoke-checks the
# deploy (docs/devops-strategy.md §8). Vercel's Git integration performs the
# actual app deploy on push; this workflow owns migrations + the health check.
#
# Ordering matters: MIGRATE BEFORE the deploy is trusted, so new code never
# meets an old schema.
#
# Requires these secrets/vars to be configured before it can pass (deferred to
# the external-wiring step — see docs/devops-strategy.md §7, §11):
#   vars.DEPLOY_ENABLED = "true"       (REPO-level flag that turns this workflow on)
#   secrets.SUPABASE_ACCESS_TOKEN      (account-level, both envs)
#   secrets.SUPABASE_DB_PASSWORD       (matching env)
#   vars.SUPABASE_PROJECT_REF          (matching env — the project subdomain, not secret)
#   vars.APP_URL                       (matching env — deployed base URL)
#
# NOTE: the on/off gate must be a REPO-level variable, not an environment-scoped
# one. A job's `if:` is evaluated before its `environment:` is loaded, so
# environment-scoped vars (APP_URL, SUPABASE_PROJECT_REF) are NOT visible in the
# `if`. They ARE visible inside the job's steps, which is where they're used.
on:
  push:
    branches: [develop, main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    # Skips cleanly until deployment is wired, so pushes don't show a red deploy
    # before Supabase/Vercel exist. Repo-level flag (see NOTE above).
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'testing' }}
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"
          supabase db push

  smoke:
    needs: migrate
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'testing' }}
    steps:
      # Both checks poll the deployed URL from OUTSIDE the app. They run after
      # `migrate` (migrate-before-deploy) and after Vercel's Git integration has
      # published the new build; the retries below absorb the gap until that
      # deploy is actually serving. A red here means the deploy is NOT trusted,
      # even though migrations already applied. APP_URL is env-scoped, so the
      # correct base URL is used per environment (Testing for develop, Production
      # for main). Context values go through `env:` rather than inline into the
      # shell so nothing is interpolated into the script body.
      - name: Health check (liveness + healthy payload)
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          set -euo pipefail
          url="${APP_URL%/}/api/health"
          echo "Checking $url"
          # One request: capture the response body and the trailing HTTP status
          # together (-w appends "\n<code>" after the body). No --fail, so we read
          # the code ourselves instead of letting curl swallow the body on 4xx/5xx.
          response=$(curl -sS --retry 5 --retry-delay 10 --retry-all-errors -w $'\n%{http_code}' "$url")
          code=${response##*$'\n'}
          body=${response%$'\n'*}
          echo "HTTP $code"
          echo "Body: $body"
          if [ "$code" != "200" ]; then
            echo "::error::health route returned HTTP $code (expected 200)"
            exit 1
          fi
          status=$(printf '%s' "$body" | jq -r '.status')
          if [ "$status" != "ok" ]; then
            echo "::error::health payload unhealthy (status=\"$status\", expected \"ok\")"
            exit 1
          fi
          echo "Health OK."

      - name: Read-path check (public login page renders)
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          set -euo pipefail
          # /login is the one route that renders 200 without a session: it exercises
          # server rendering AND the Supabase auth client (createClient + getUser),
          # so a 200 proves the deployed app booted and can reach Supabase. Every
          # data route is RLS-gated and 307-redirects to /login when unauthenticated,
          # so none can be smoke-checked for 200 without real credentials.
          url="${APP_URL%/}/login"
          echo "Checking $url"
          code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 10 --retry-all-errors "$url")
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::read path $url returned HTTP $code (expected 200)"
            exit 1
          fi
          echo "Read path OK."
