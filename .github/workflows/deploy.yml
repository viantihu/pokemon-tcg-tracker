name: Deploy

# Applies DB migrations to the matching environment, then smoke-checks the
# deploy (docs/devops-strategy.md §8). Vercel's Git integration performs the
# actual app deploy on push; this workflow owns migrations + the health check.
#
# Ordering matters: MIGRATE BEFORE the deploy is trusted, so new code never
# meets an old schema.
#
# Requires these secrets/vars to be configured before it can pass (deferred to
# the external-wiring step — see docs/devops-strategy.md §7, §11):
#   vars.DEPLOY_ENABLED = "true"       (REPO-level flag that turns this workflow on)
#   secrets.SUPABASE_ACCESS_TOKEN      (account-level, both envs)
#   secrets.SUPABASE_DB_PASSWORD       (matching env)
#   vars.SUPABASE_PROJECT_REF          (matching env — the project subdomain, not secret)
#   vars.APP_URL                       (matching env — deployed base URL)
#
# NOTE: the on/off gate must be a REPO-level variable, not an environment-scoped
# one. A job's `if:` is evaluated before its `environment:` is loaded, so
# environment-scoped vars (APP_URL, SUPABASE_PROJECT_REF) are NOT visible in the
# `if`. They ARE visible inside the job's steps, which is where they're used.
on:
  push:
    branches: [develop, main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    # Skips cleanly until deployment is wired, so pushes don't show a red deploy
    # before Supabase/Vercel exist. Repo-level flag (see NOTE above).
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'testing' }}
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"
          supabase db push

  smoke:
    needs: migrate
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'testing' }}
    steps:
      - name: Health check
        run: |
          url="${{ vars.APP_URL }}/api/health"
          echo "Checking $url"
          code=$(curl -sS -o /dev/null -w "%{http_code}" --retry 5 --retry-delay 10 --retry-all-errors "$url")
          echo "HTTP $code"
          test "$code" = "200"
