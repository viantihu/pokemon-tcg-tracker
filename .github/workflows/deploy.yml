name: Deploy

# Applies DB migrations to the matching environment, then smoke-checks the
# deploy (docs/devops-strategy.md §8). Vercel's Git integration performs the
# actual app deploy on push; this workflow owns migrations + the health check.
#
# Ordering matters: MIGRATE BEFORE the deploy is trusted, so new code never
# meets an old schema.
#
# Requires these secrets/vars to be configured before it can pass (deferred to
# the external-wiring step — see docs/devops-strategy.md §7, §11):
#   vars.DEPLOY_ENABLED = "true"       (REPO-level flag that turns this workflow on)
#   secrets.SUPABASE_DB_PASSWORD       (matching env — `migrate` connects with this)
#   vars.SUPABASE_DB_POOLER_HOST       (matching env — Supavisor host, see `migrate` below)
#   vars.SUPABASE_PROJECT_REF          (matching env — the project subdomain, not secret)
#   vars.APP_URL                       (matching env — deployed base URL)
#   secrets.SUPABASE_ANON_KEY          (testing — the `acceptance` job FAILS without it;
#                                       holds the publishable key on a current project)
#   secrets.SUPABASE_SERVICE_ROLE_KEY  (testing — the `acceptance` job FAILS without it;
#                                       holds the secret key on a current project)
#   secrets.SUPABASE_ACCESS_TOKEN      (OPTIONAL. `migrate` no longer uses it at all —
#                                       see UIL-005. The `acceptance` job still tries it
#                                       as a best-effort shortcut for deriving its two
#                                       keys, and tolerates a 403.)
#
# NOTE: the on/off gate must be a REPO-level variable, not an environment-scoped
# one. A job's `if:` is evaluated before its `environment:` is loaded, so
# environment-scoped vars (APP_URL, SUPABASE_PROJECT_REF) are NOT visible in the
# `if`. They ARE visible inside the job's steps, which is where they're used.
on:
  push:
    branches: [develop, main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # DEPLOY_ENABLED is the kill switch for a workflow that touches Production, and it
  # must stay one: 'false' skips every job below deliberately and quietly. What must
  # NOT be quiet is the variable being ABSENT or misspelled — before this job existed,
  # an unset var made every job skip and the run report GREEN having deployed nothing
  # (docs/root-cause-analysis.md RC-6b: "a skipped job is green"). Now the only way to
  # get a green Deploy that did nothing is to have written the word 'false' into the
  # repo variable on purpose. Repo-level, not environment-scoped, because job `if:`s
  # are evaluated before any environment loads (see NOTE above).
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: DEPLOY_ENABLED must be exactly 'true' or 'false'
        env:
          DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
        run: |
          set -euo pipefail
          case "${DEPLOY_ENABLED:-}" in
            true)  echo "DEPLOY_ENABLED=true: migrate, acceptance and smoke will run." ;;
            false) echo "::warning::DEPLOY_ENABLED=false: deploy DELIBERATELY disabled. migrate, acceptance and smoke are skipped on purpose. Nothing was deployed by this run." ;;
            "")    echo "::error::vars.DEPLOY_ENABLED is not set on this repository. Every deploy job would skip and this run would report green having deployed nothing. Set the REPO-level variable to 'true' to deploy, or to 'false' to switch deploys off on purpose." ; exit 1 ;;
            *)     echo "::error::vars.DEPLOY_ENABLED is '${DEPLOY_ENABLED}', which is neither 'true' nor 'false'. Refusing to guess: every deploy job would skip on this value and the run would report green. Fix the repo variable." ; exit 1 ;;
          esac

  migrate:
    # Skips cleanly when the kill switch is 'false' (preflight above guarantees the
    # variable is one of the two legal values). Repo-level flag (see NOTE above).
    needs: preflight
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'testing' }}
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      # NO `supabase link`, DELIBERATELY (UIL-005). `link` is a Management API call, so
      # it depends on secrets.SUPABASE_ACCESS_TOKEN having project privileges — and that
      # PAT started returning
      #
      #   403 "Your account does not have the necessary privileges to access this endpoint"
      #
      # on 2026-09-13 without anything in this repo changing (the secret was last written
      # 2026-09-08, before the last green run). Every push to `develop` for a full day
      # failed here, which means Testing kept running new code against an old schema —
      # exactly what the migrate-before-deploy ordering above exists to prevent, silently
      # inverted. Vercel deploys the app on push regardless of this workflow, so a red
      # `migrate` does not hold the app back; it only removes the schema half.
      #
      # `db push --db-url` talks to Postgres directly and never touches the Management
      # API, so migrations no longer depend on a PAT's privileges at all. The credential
      # it does need, secrets.SUPABASE_DB_PASSWORD, was already configured on both
      # environments. Deleting the coupling is better than restoring the token: the
      # account-level privileges of a PAT are outside this repo's control and can be
      # narrowed again at any time, whereas the DB password is per-project and is the
      # thing `db push` actually authenticates with either way.
      #
      # THE POOLER IS NOT OPTIONAL. `db.<ref>.supabase.co` publishes AAAA records only —
      # no A record — and GitHub-hosted runners have no IPv6, so the direct host is
      # unreachable from CI (`dial error ... connect ECONNREFUSED 2600:1f18:...`). Supavisor
      # is dual-stack, hence vars.SUPABASE_DB_POOLER_HOST. It is region-pinned per project
      # and is NOT derivable from the project ref, so it is stored per environment:
      #   testing    cpmwdcmokbgcpmkvbtsw -> aws-0-us-east-1.pooler.supabase.com
      #   production bqqerxpdxywnpvndhxbs -> aws-0-us-west-2.pooler.supabase.com
      # To find it for a new project, read it off the dashboard (Connect -> Session pooler),
      # or probe: the wrong host answers `tenant/user postgres.<ref> not found`, the right
      # one gets as far as real Postgres authentication.
      #
      # PORT 5432, NOT 6543. 5432 is Supavisor's SESSION mode, which holds one dedicated
      # backend per connection and so supports the multi-statement transactions and
      # advisory locks that `db push` wraps each migration in. 6543 is TRANSACTION mode and
      # would break them — the same distinction scripts/promote-collection.mjs documents.
      #
      # Testing self-heals from a divergent migration history; Production keeps the
      # strict rail. `db push` refuses any local migration that sorts behind the
      # last version in the remote history table — the state Testing landed in when
      # 0003_config.sql was authored after 0004 had already shipped. On Testing that
      # refusal protects nothing (the data is throwaway, devops-strategy §5) and just
      # blocks every deploy, so it pushes with --include-all. On Production the
      # refusal is a real safety rail and stays on: a divergence there needs a human.
      #
      # The primary guard against divergence is now scripts/check-migration-order.mjs,
      # which fails the PR before a mis-ordered migration can ever be merged.
      - name: Push migrations
        env:
          # Read via env, never interpolated into the script body.
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          POOLER_HOST: ${{ vars.SUPABASE_DB_POOLER_HOST }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Name whichever one is missing. A generic "not configured" sends the reader
          # back into this file to work out which of three things to go and set.
          missing=""
          [ -n "${PROJECT_REF:-}" ] || missing="vars.SUPABASE_PROJECT_REF"
          [ -n "${POOLER_HOST:-}" ] || missing="${missing:+$missing, }vars.SUPABASE_DB_POOLER_HOST"
          [ -n "${DB_PASSWORD:-}" ] || missing="${missing:+$missing, }secrets.SUPABASE_DB_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Cannot push migrations — missing $missing on the '${REF_NAME}' environment. See the comment above this step: migrations connect straight to Postgres through the session-mode pooler and need the project ref, the pooler host for that project's region, and the database password. SUPABASE_ACCESS_TOKEN is deliberately NOT used here."
            exit 1
          fi

          # `--db-url` requires a percent-encoded connection string, and a database
          # password is free to contain '@', '/', ':' or '#' — any of which silently
          # reshapes the URL into a different host or database rather than failing.
          # jq's @uri is on every runner and gets the escaping right.
          enc_password=$(jq -rn --arg v "$DB_PASSWORD" '$v | @uri')
          # Encoding a secret produces a NEW string that GitHub's log masking does not
          # know about, so register it before it can be echoed by anything below.
          echo "::add-mask::$enc_password"
          db_url="postgresql://postgres.${PROJECT_REF}:${enc_password}@${POOLER_HOST}:5432/postgres"
          echo "::add-mask::$db_url"

          # Log the target with the credential left out, so a run is diagnosable without
          # relying on masking to hold.
          echo "Pushing migrations to postgres.${PROJECT_REF}@${POOLER_HOST}:5432 (session mode)."

          if [ "$REF_NAME" = "main" ]; then
            supabase db push --db-url "$db_url"
          else
            supabase db push --db-url "$db_url" --include-all
          fi

      # `db push` exits 0 when there is nothing to do, which is correct but
      # indistinguishable from "it applied everything" in a log — and this workflow just
      # spent a day reporting a schema state that was not real. So state the schema
      # version the environment is actually on, and fail if the newest local migration is
      # not in its history table.
      #
      # This is the assertion UIL-005 was missing. `migrate` going green while Testing sat
      # on 0006 is what let a 0007-era backfill reach a 0006 `apply_write_ops`.
      # Asserted with SQL rather than by parsing `supabase migration list`, whose table
      # layout is presentation and could change under a `version: latest` CLI. The history
      # table is the same thing the CLI reads and its shape is fixed. `psql` is part of the
      # postgresql-client package preinstalled on GitHub's ubuntu runner images; the check
      # below says so out loud rather than letting a missing binary read as a schema fault.
      - name: Prove the migrations actually landed
        env:
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          POOLER_HOST: ${{ vars.SUPABASE_DB_POOLER_HOST }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if ! command -v psql > /dev/null; then
            echo "::error::psql is not on this runner, so the applied schema version cannot be read back. psql ships with the postgresql-client package that GitHub's ubuntu images preinstall; if that changed, add \`sudo apt-get install -y postgresql-client\` before this step. This is a tooling gap, NOT a migration failure — the push above already succeeded."
            exit 1
          fi

          # Migration versions are the leading digits of the filename: 0007_x.sql -> 0007,
          # which is what the CLI records in the history table.
          ls supabase/migrations/*.sql | sed 's#.*/##; s#_.*##' | sort > local-versions.txt
          echo "Local migrations: $(tr '\n' ' ' < local-versions.txt)"

          enc_password=$(jq -rn --arg v "$DB_PASSWORD" '$v | @uri')
          echo "::add-mask::$enc_password"
          db_url="postgresql://postgres.${PROJECT_REF}:${enc_password}@${POOLER_HOST}:5432/postgres"
          echo "::add-mask::$db_url"

          # -t no header, -A unaligned, -X ignore ~/.psqlrc, ON_ERROR_STOP so a missing
          # table fails the step instead of printing to stderr and exiting 0.
          psql "$db_url" -tAX -v ON_ERROR_STOP=1 \
            -c "select version from supabase_migrations.schema_migrations order by version" \
            | sed '/^$/d' | sort > applied-versions.txt
          echo "Applied on this environment: $(tr '\n' ' ' < applied-versions.txt)"

          # A set difference, not a max() comparison: `--include-all` can leave a HOLE in
          # the middle of the history (a migration authored behind one already applied),
          # and comparing only the newest version would call that fully migrated.
          comm -23 local-versions.txt applied-versions.txt > unapplied.txt
          if [ -s unapplied.txt ]; then
            echo "::error::these migrations are in the repo but NOT in this environment's history table: $(tr '\n' ' ' < unapplied.txt). New code is about to serve against an older schema — the condition the migrate-before-deploy ordering at the top of this file exists to prevent, and the state Testing sat in through 2026-09-13 while \`migrate\` died at \`supabase link\` (UIL-005). If EVERY version is listed as unapplied and the app is plainly working, suspect this check rather than the schema: it assumes the CLI records the filename's digit prefix ('0007') as the version, so compare against the applied list printed above."
            exit 1
          fi
          echo "Schema matches the repo: all $(wc -l < local-versions.txt | tr -d ' ') migrations applied."

  # The M1 acceptance suite (dev-spec §8: "worked examples ... pass as automated
  # tests") needs a real Supabase project — it asserts that RLS denies anonymous
  # reads on every table, which PGlite cannot model. It therefore skips in `pnpm
  # test` and has never actually executed anywhere. This runs it against Testing
  # right after migrations land, which is the only place it can run.
  #
  # Read-only (SELECTs only), so it is safe against the shared Testing project.
  # Testing only: never point a suite that asserts on seed data at Production.
  #
  # This job FAILS rather than skips when its credentials are missing. It was added
  # (#33) to finally run that suite, then never ran once: its credential check
  # skipped cleanly whenever SUPABASE_ANON_KEY / SUPABASE_SERVICE_ROLE_KEY were
  # unset on the `testing` environment, and neither had ever been set. Deploy
  # therefore reported green while the suite it exists to run never executed —
  # the same silent skip that let Testing's catalog sit empty until UAT caught it
  # (UIL-004), which catalog-mirror.yml stopped doing for exactly this reason.
  #
  # Failing costs little and is honest. `smoke` is `needs: migrate`, NOT
  # `needs: acceptance`, so a red acceptance never suppresses the migration or
  # health-check signal, and a red Deploy blocks nothing automatically here. An
  # advisory notice buys a green check that asserts nothing.
  acceptance:
    needs: migrate
    if: ${{ vars.DEPLOY_ENABLED == 'true' && github.ref_name == 'develop' }}
    runs-on: ubuntu-latest
    environment: testing
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # BOTH keys are required, for opposite halves of the same assertion: the
      # client-side key proves RLS DENIES an unauthenticated read, and the
      # server-side key proves those rows ARE present for a privileged caller.
      # Without the second, "RLS denied me" and "the table is empty" are
      # indistinguishable, so a pass would prove nothing.
      #
      # KEY FORMAT. Supabase is retiring the legacy JWT `anon` / `service_role` pair
      # (end of 2026) in favour of `sb_publishable_…` / `sb_secret_…`, so on a current
      # project these are the PUBLISHABLE and SECRET keys, and on a project with legacy
      # keys still enabled they are `anon` / `service_role`. Both are handled below.
      # The GitHub secret names stay SUPABASE_ANON_KEY / SUPABASE_SERVICE_ROLE_KEY —
      # those are historical names, not claims about the format.
      #
      # What actually matters is not the format but that the values MATCH what the app
      # already has in Vercel (NEXT_PUBLIC_SUPABASE_ANON_KEY / SUPABASE_SERVICE_ROLE_KEY),
      # so the suite asserts against the same project the app talks to.
      #
      # Best-effort first: derive them from the Supabase PAT the deploy already
      # uses, which saves pasting the same values twice. That needs a PAT with
      # secret-read privileges, and a narrowly-scoped one gets a 403 (the step logs
      # which) — expected, not a fault. The dependable path is the two environment
      # secrets, and they always win when present.
      #
      # Unlike catalog-mirror.yml, nothing here curls Supabase's REST gateway directly,
      # so that workflow's apikey-vs-Bearer rule has no call site in this job: the keys
      # go to supabase-js inside vitest. See the note on the suite step below for the
      # one way that distinction can still bite.
      - name: Resolve the acceptance credentials
        env:
          ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          anon="${ANON_KEY:-}"
          service="${SERVICE_KEY:-}"
          # Tracked per key, so a mixed resolve (one secret, one derived) reports
          # honestly instead of crediting everything to whichever ran last.
          anon_src="secrets.SUPABASE_ANON_KEY"
          service_src="secrets.SUPABASE_SERVICE_ROLE_KEY"

          # GET the given Management API path, echoing the HTTP status and (on a
          # non-200) the API's message. Only ever prints key NAMES, never values.
          fetch() {
            local path="$1" out code
            out=$(curl -sS --retry 3 --retry-delay 5 -w $'\n%{http_code}' \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN:-}" \
              "https://api.supabase.com/v1$path" || printf '\n000')
            code=${out##*$'\n'}
            body=${out%$'\n'*}
            if [ "$code" != "200" ]; then
              echo "  GET $path -> HTTP $code: $(printf '%s' "$body" | jq -r '.message // .error // "(no message)"' 2>/dev/null)"
              body=""
            fi
          }

          if { [ -z "$anon" ] || [ -z "$service" ]; } \
             && [ -n "${SUPABASE_ACCESS_TOKEN:-}" ] && [ -n "${PROJECT_REF:-}" ]; then
            # Current key list. Select on the VALUE's prefix rather than on a `name` or
            # `type` enum: `sb_publishable_` / `sb_secret_` are documented and stable,
            # whereas a new key's name is whatever it was created as, and only the legacy
            # pair is reliably named `anon` / `service_role`. Filtering on the legacy
            # names alone never matches on a new-key project. Prefer the new format, fall
            # back to legacy.
            fetch "/projects/$PROJECT_REF/api-keys?reveal=true"
            if [ -n "$body" ]; then
              echo "  keys returned: $(printf '%s' "$body" | jq -rc '[.[]? | {name, type}] // []' 2>/dev/null)"
              if [ -z "$anon" ]; then
                anon=$(printf '%s' "$body" | jq -r '
                  [.[]? | .api_key // empty | select(startswith("sb_publishable_"))] | first // empty')
                [ -n "$anon" ] || anon=$(printf '%s' "$body" | jq -r '[.[]? | select(.name == "anon") | .api_key] | first // empty')
                [ -z "$anon" ] || anon_src="the Management API (api-keys)"
              fi
              if [ -z "$service" ]; then
                service=$(printf '%s' "$body" | jq -r '
                  [.[]? | .api_key // empty | select(startswith("sb_secret_"))] | first // empty')
                [ -n "$service" ] || service=$(printf '%s' "$body" | jq -r '[.[]? | select(.name == "service_role") | .api_key] | first // empty')
                [ -z "$service" ] || service_src="the Management API (api-keys)"
              fi
            fi

            # Older projects expose the JWT pair on a separate endpoint instead.
            if [ -z "$anon" ] || [ -z "$service" ]; then
              fetch "/projects/$PROJECT_REF/api-keys/legacy"
              if [ -n "$body" ]; then
                echo "  legacy fields: $(printf '%s' "$body" | jq -rc 'if type == "array" then [.[]?.name] else keys end' 2>/dev/null)"
                if [ -z "$anon" ]; then
                  anon=$(printf '%s' "$body" | jq -r '
                    if type == "array"
                    then ([.[]? | select(.name == "anon") | (.api_key // .apiKey)] | first)
                    else (.anon // .anon_key // .anonKey)
                    end // empty')
                  [ -z "$anon" ] || anon_src="the Management API (legacy)"
                fi
                if [ -z "$service" ]; then
                  service=$(printf '%s' "$body" | jq -r '
                    if type == "array"
                    then ([.[]? | select(.name == "service_role") | (.api_key // .apiKey)] | first)
                    else (.service_role // .service_role_key // .serviceRoleKey)
                    end // empty')
                  [ -z "$service" ] || service_src="the Management API (legacy)"
                fi
              fi
            fi
          fi

          # Name exactly which one is missing — a generic "credentials missing" sends
          # the reader back to the workflow file to work it out.
          missing=""
          [ -n "$anon" ] || missing="SUPABASE_ANON_KEY"
          [ -n "$service" ] || missing="${missing:+$missing and }SUPABASE_SERVICE_ROLE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing $missing, so the M1 acceptance suite cannot run — and this job will NOT pretend it did. Fix: open the Supabase dashboard for project ${PROJECT_REF:-<unset vars.SUPABASE_PROJECT_REF>} -> Project Settings -> API Keys, copy the PUBLISHABLE key (sb_publishable_...) and the SECRET key (sb_secret_...) — or the legacy 'anon' and 'service_role' keys if this project still has legacy keys enabled — then add them as GitHub *environment* secrets on the 'testing' environment: the publishable/anon value as SUPABASE_ANON_KEY and the secret/service_role value as SUPABASE_SERVICE_ROLE_KEY (repo Settings -> Environments -> testing -> Environment secrets; repo-level secrets are NOT read here). The secret NAMES are historical and do not imply the legacy format. Each value must MATCH what the app already has in Vercel (NEXT_PUBLIC_SUPABASE_ANON_KEY and SUPABASE_SERVICE_ROLE_KEY), so the suite asserts against the same project the app uses. A 403 above means SUPABASE_ACCESS_TOKEN lacks the secret-read privilege, which is expected for a scoped PAT and is not a fault."
            exit 1
          fi

          # Mask before either can reach a log line, then hand them to later steps.
          echo "::add-mask::$anon"
          echo "::add-mask::$service"
          echo "ACCEPTANCE_ANON_KEY=$anon" >> "$GITHUB_ENV"
          echo "ACCEPTANCE_SERVICE_KEY=$service" >> "$GITHUB_ENV"

          # Report the FORMAT (never the value). Worth logging because a format mismatch
          # between these keys and the ones the app holds in Vercel is the likeliest
          # cause of a confusing failure in the next step.
          describe() {
            case "$1" in
              sb_publishable_*) echo "publishable key (sb_publishable_...)" ;;
              sb_secret_*) echo "secret key (sb_secret_...)" ;;
              sb_*) echo "an sb_ key of an unrecognized subtype" ;;
              eyJ*) echo "legacy JWT key" ;;
              *) echo "unrecognized format" ;;
            esac
          }
          echo "client key: from $anon_src, $(describe "$anon")"
          echo "server key: from $service_src, $(describe "$service")"

      # No `if:` gate — reaching this step means the credentials resolved, and a
      # failure here is a real failure.
      #
      # KNOWN RISK on a new-format key, called out so a first red run is not misread as
      # a broken assertion. The suite builds its own clients via supabase-js
      # `createClient`, and 2.115 still adds an Authorization: Bearer fallback on
      # sessionless requests. Supabase's gateway rejects a non-JWT sent that way with
      # "Invalid JWT", and the `omitApiKeyAsBearer` escape hatch is internal to the
      # Functions client, so it is not reachable through `createClient`. If that appears
      # here, it is a library limitation rather than an RLS or schema failure, and the
      # fix is a supabase-js upgrade — not a change to this workflow or to the suite.
      # The app itself is unaffected and works today.
      - name: M1 acceptance suite against Testing
        env:
          M1_ACCEPTANCE_VERIFY: "1"
          # Derived from the project ref we already store, so there is no third
          # value to configure.
          SUPABASE_URL: https://${{ vars.SUPABASE_PROJECT_REF }}.supabase.co
          SUPABASE_ANON_KEY: ${{ env.ACCEPTANCE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.ACCEPTANCE_SERVICE_KEY }}
        run: |
          set -euo pipefail
          # `default` keeps the run readable in the log; `json` gives the next step
          # something to assert on.
          pnpm vitest run tests/repo/m1-acceptance.test.ts \
            --reporter=default --reporter=json --outputFile.json=acceptance-report.json

      # The suite has its OWN silent skip: it resolves its target via env or a local
      # `supabase status`, and wraps everything in `describe.skipIf(env === null)`. So
      # if a key were present but wrong-shaped (or M1_ACCEPTANCE_VERIFY got dropped),
      # vitest exits 0 having run nothing — measured: 20 total, 0 passed, 20 pending,
      # success: true. Fixing only the credential gate above would leave that second
      # skip free to keep this job green over zero assertions, so assert on the report
      # rather than on the exit code.
      # No `always()`: a vitest failure is already loud and red on its own, and the
      # only case this step exists to catch is vitest exiting 0 over zero assertions,
      # which reaches here anyway.
      - name: Prove the suite actually ran
        run: |
          set -euo pipefail
          if [ ! -f acceptance-report.json ]; then
            echo "::error::vitest produced no JSON report, so there is no evidence the acceptance suite ran."
            exit 1
          fi
          read -r total passed pending failed < <(jq -r \
            '[.numTotalTests, .numPassedTests, .numPendingTests, .numFailedTests] | @tsv' \
            acceptance-report.json)
          echo "total=$total passed=$passed pending=$pending failed=$failed"
          if [ "$total" -eq 0 ]; then
            echo "::error::the acceptance suite reported 0 tests — it did not run."
            exit 1
          fi
          if [ "$pending" -gt 0 ]; then
            echo "::error::$pending of $total acceptance tests were SKIPPED, not run. The suite's own describe.skipIf fired, which means it could not resolve a Supabase target: check that SUPABASE_URL points at the Testing project, that SUPABASE_ANON_KEY and SUPABASE_SERVICE_ROLE_KEY hold real values for it, and that M1_ACCEPTANCE_VERIFY=1 reached the test process."
            exit 1
          fi
          if [ "$passed" -ne "$total" ]; then
            echo "::error::only $passed of $total acceptance tests passed ($failed failed). If the failures above mention \"Invalid JWT\", see the KNOWN RISK note on the previous step: that is supabase-js sending a non-JWT key as a Bearer token, not a failing assertion about RLS."
            exit 1
          fi
          echo "Acceptance suite ran for real: $passed/$total passed, 0 skipped."

  smoke:
    needs: migrate
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'testing' }}
    steps:
      # Both checks poll the deployed URL from OUTSIDE the app. They run after
      # `migrate` (migrate-before-deploy) and after Vercel's Git integration has
      # published the new build; the retries below absorb the gap until that
      # deploy is actually serving. A red here means the deploy is NOT trusted,
      # even though migrations already applied. APP_URL is env-scoped, so the
      # correct base URL is used per environment (Testing for develop, Production
      # for main). Context values go through `env:` rather than inline into the
      # shell so nothing is interpolated into the script body.
      - name: Health check (liveness + healthy payload)
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          set -euo pipefail
          url="${APP_URL%/}/api/health"
          echo "Checking $url"
          # One request: capture the response body and the trailing HTTP status
          # together (-w appends "\n<code>" after the body). No --fail, so we read
          # the code ourselves instead of letting curl swallow the body on 4xx/5xx.
          response=$(curl -sS --retry 5 --retry-delay 10 --retry-all-errors -w $'\n%{http_code}' "$url")
          code=${response##*$'\n'}
          body=${response%$'\n'*}
          echo "HTTP $code"
          echo "Body: $body"
          if [ "$code" != "200" ]; then
            echo "::error::health route returned HTTP $code (expected 200)"
            exit 1
          fi
          status=$(printf '%s' "$body" | jq -r '.status')
          if [ "$status" != "ok" ]; then
            echo "::error::health payload unhealthy (status=\"$status\", expected \"ok\")"
            exit 1
          fi
          echo "Health OK."

      - name: Read-path check (public login page renders)
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          set -euo pipefail
          # /login is the one route that renders 200 without a session: it exercises
          # server rendering AND the Supabase auth client (createClient + getUser),
          # so a 200 proves the deployed app booted and can reach Supabase. Every
          # data route is RLS-gated and 307-redirects to /login when unauthenticated,
          # so none can be smoke-checked for 200 without real credentials.
          url="${APP_URL%/}/login"
          echo "Checking $url"
          code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 10 --retry-all-errors "$url")
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::read path $url returned HTTP $code (expected 200)"
            exit 1
          fi
          echo "Read path OK."
